 {id:'decisions',title:'决定已确认，并在当前候选落实',ok:p.decisions.every(id=>s.decisions[id].state==='confirmed'&&s.decisions[id].implementedAt===p.head),detail:p.decisions.length?p.decisions.map(id=>{const d=s.decisions[id];return `${id}：${d.state!=='confirmed'?'等待你的范围决定':d.implementedAt!==p.head?'决定有效，当前实施证据待核对':'当前实施已核对'}`;}).join('；'):'本次交付无额外范围决定'},

 ];

function eligible(p){return !p.merged&&requirements(p).every(c=>c.ok)&&!p.draft&&!p.conflict&&p.phase==='accepted';}
function permission(p){if(s.mode==='readonly')return {ok:false,label:'只读模式',detail:'当前不执行发布或合入；可查看条件与生成交接包。'};if(s.mode==='confirm')return {ok:true,manual:true,label:'逐次确认',detail:'本次操作需要确认具体候选、目标和合入方法。'};if(!s.grantActive)return {ok:false,label:'委托已撤销',detail:'不再发送新的受委托操作；已经发出的请求先核查。'};return {ok:true,manual:false,label:'有限委托',detail:'TX-AUTH-01 · 技术合入；无新增业务口径、付费、部署或清理。'};}
function labelFor(p){if(p.merged)return ['已合入 '+p.merged.target,'green'];if(pending('merge',p.id)?.state==='unknown')return ['合入回执未知','amber'];if(pending('merge',p.id))return ['合入请求中','blue'];if(!targetValid(p))return ['目标待核对','red'];if(p.phase==='accepted')return eligible(p)?['可按授权合入','green']:['证据需更新','amber'];if(p.phase==='receiving')return ['接收中','blue'];if(p.phase==='rework')return ['待修正','red'];if(p.phase==='working')return ['开发中',''];if(p.phase==='blocked')return ['等待前置','amber'];return ['待接收',''];}
function nextStep(p){if(p.merged)return p.acceptance?.result==='accept'?'最终代码已合入；业务采纳仍按项目规则判断':'在最终版本上确认用户体验，已有证据可按范围复用';if(pending('merge',p.id)?.state==='unknown')return '接收服务核查原合入请求，不发送第二次请求';if(!targetValid(p))return `负责人核对实际 ${p.target} 与采用目标 ${p.plannedTarget}`;if(p.decisions.some(id=>s.decisions[id].state!=='confirmed'))return '由你决定历史材料缺失的处理范围；仅阻塞相关交付';if(p.phase==='rework')return '交来源接口负责人修复已确认反例，再补必要验证';if(p.phase==='working')return '实现者完成导出接线；不因等待计算合入而停止独立工作';if(p.phase==='accepted')return eligible(p)?'接收服务按有效授权合入指定目标，随后读回结果':'接收者重新核对变化，仅补充受影响证据';if(p.phase==='receiving')return '接收方核对当前组合、已验证范围与剩余限制';if(p.phase==='blocked')return '负责人补齐列明的依赖；无关任务继续';return '接收方 Claude 核对这次交付，并给出明确结论';}
function nextOwner(p){if(p.decisions.some(id=>s.decisions[id].state!=='confirmed'))return ['你','决定交付范围'];if(p.merged)return ['项目负责人','用户验收'];if(p.phase==='rework'||p.phase==='working')return [authorOf(p)?.engine||'开发者',p.phase==='rework'?'有限修复':'实现与自查'];if(p.phase==='blocked')return ['交付负责人','协调前置'];return ['接收方 Claude',p.phase==='accepted'?'按授权合入':'独立接收'];}
function receiveCount(){return Object.values(s.prs).filter(p=>p.phase==='receiving'&&!p.merged).length;}
function queueEntries(filter='all'){let list=Object.values(s.prs);if(filter==='all')list=list.filter(p=>!p.merged&&p.phase!=='working');else if(filter==='queued')list=list.filter(p=>!p.merged&&['queued','blocked'].includes(p.phase));else if(filter==='active')list=list.filter(p=>!p.merged&&['receiving','accepted'].includes(p.phase));else if(filter==='rework')list=list.filter(p=>!p.merged&&p.phase==='rework');else if(filter==='merged')list=list.filter(p=>p.merged);return list.sort((a,b)=>({accepted:0,receiving:1,queued:2,rework:3,blocked:4,working:5,merged:6}[a.phase])-({accepted:0,receiving:1,queued:2,rework:3,blocked:4,working:5,merged:6}[b.phase])||a.id-b.id);}
function pageHead(up,title,desc,actions=''){return `<div class="pagehead"><div><div class="up">${up}</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="row">${actions}</div>`:''}</div>`;}
function shellUpdate(){document.documentElement.dataset.theme=s.theme;const titles={overview:'项目总览',work:'任务、会话与 PR',comms:'通信与交付'};$('#crumb').textContent=titles[s.page]||titles.overview;$$('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===s.page);b.setAttribute('aria-current',b.dataset.nav===s.page?'page':'false');});$('#nav-work-count').textContent=Object.values(s.prs).filter(p=>!p.merged).length;$('#nav-message-count').textContent=s.messages.filter(m=>m.status!=='replied').length;const count=Object.values(s.decisions).filter(d=>d.state!=='confirmed').length;$('#nav-decision-count').textContent=count;$('#nav-decision-count').hidden=!count;$('#access-mode').textContent=s.mode==='readonly'?'只读':s.mode==='confirm'?'逐次确认':s.grantActive?'有限委托':'委托已撤销';$('#observed').textContent=s.observed;$('#storage-note').textContent=storageAvailable?'本地保存已开启':'本次页面内保存';$('#theme-button').innerHTML=icon(s.theme==='dark'?'sun':'moon');}

function renderOverview(){const ready=P(102).merged?null:P(102);const currentReady=!!ready&&testFresh(ready)&&reviewFresh(ready)&&ready.review.verdict==='PASS';const openDecision=Object.values(s.decisions).find(d=>d.state!=='confirmed');const unknown=Object.values(s.sessions).filter(a=>a.state==='unknown').length;return pageHead('PROJECT / OVERVIEW','项目总览',`${Object.values(s.prs).filter(p=>!p.merged).length} 项在途交付，下一步责任都在这里。`,btn(icon('refresh')+'核对最新状态','sync','','')+btn(icon('flag')+'现在需要我','decisions','','primary'))+`<div class="overview-layout"><div class="stack"><section class="summary-panel"><div><div class="up">DELIVERY BRIEF · 示例简报</div><h2>${ready?(currentReady?'计算链路已经就绪，<br>让成果进入正确的目标。':'候选已经更新，<br>先核对变化，再继续交付。'):'计算交付已进入主干，<br>下一步确认真实使用体验。'}</h2><p>${ready?(currentReady?'局部更新的组合检查已完成。接收方确认范围后，可按现有委托合入 main。':'历史证据仍然保留，但不代表新候选已经通过。下一步由接收者核对受影响部分。'):'代码合入不是目标自动完成；最终版本的使用入口、结果和限制需要被看见。'}</p>${btn((ready?'查看 PR #102':'查看已合入成果')+' '+icon('arrow'),'pr',102)}</div><div class="summary-art" aria-hidden="true"><div class="art-line a"></div><div class="art-line"></div><div class="art-line b"></div><div class="art-node" style="left:0;top:2px">${icon('file',true)}</div><div class="art-node" style="left:0;top:38px">${icon('check',true)}</div><div class="art-node" style="left:0;top:74px">${icon('test',true)}</div><div class="art-node main">${icon('branch')}</div></div></section><section class="metrics" aria-label="当前交付概况">${[[queueEntries('queued').length,'待接收','等待明确接收结论','queued','inbox'],[receiveCount(),'接收中',`${receiveCount()} / ${s.slots} 个并行席位`,'active','test'],[openDecision?1:0,'需要你','只提交真正的取舍','decisions','flag'],[unknown,'状态待核查','未知不等于退出','sessions','plug']].map(([num,label,note,id,i])=>`<button class="metric" data-action="metric" data-id="${id}"><span class="label">${label}${icon(i)}</span><b>${num}</b><small>${note}</small></button>`).join('')}</section>${queuePanel()}<div class="between"><h2>三个目标，一条交付主线</h2>${link('查看全部任务 '+icon('arrow',true),'navigate','work function sessionCard(a){return `<section class="card session-card"><div class="between"><div class="row">${avatar(a.engine)}<b class="small">${esc(a.id)}</b></div>${status(a.state)}</div><div class="session-role">${esc(a.role)}</div><p>${esc(a.event)}</p><code>${esc(a.workspace)}</code><div class="capabilities-line">${a.caps.map(c=>badge(({observe:'读取事件',send:'定向投递',pause:'请求暂停',resume:'指定接续'})[c])).join('')||badge('连接能力待验证','amber')}</div><div class="between"><span class="tiny muted">${a.tasks.map(id=>'#'+id).join(' · ')||'顶层协调'}${a.todos.length?' · '+a.todos.length+' 项排队':''}</span>${btn('查看现场','session',a.id,'sm')}</div></section>`;}
function messageStatus(m){return ({pending:['待投递',''],sending:['投递中','blue'],delivered:['已送达','green'],replied:['已回复','green'],held:['暂存','amber'],refused:['被拒绝','red'],unknown:['回执未知','amber']})[m.status]||[m.status,''];}
function renderComms(){const ms=s.messages.filter(m=>s.msgFilter==='all'||(s.msgFilter==='waiting'&&m.status!=='replied')||(s.msgFilter==='artifacts'&&m.artifact&&s.artifacts[m.artifact]?.state!=='verified')||(s.msgFilter==='unknown'&&['unknown','held','refused'].includes(m.status)));const m=ms.find(x=>x.id===s.selectedMessage)||ms[0];return pageHead('COMMUNICATION / HANDOFF','通信与交付','提醒指向原记录，交接直到被真正消费。',btn(icon('send')+'发起交接','compose','','primary'))+`<div class="messages-toolbar">${[['all','全部'],['waiting','待回复'],['artifacts','待消费'],['unknown','需核查']].map(([v,t])=>btn(t,'msg-filter',v,'sm '+(s.msgFilter===v?'active':''))).join('')}<span class="spacer"></span><span class="tiny muted">${ms.length} 条工作消息 · 不镜像完整聊天</span></div><div class="comms-layout"><section class="card message-list">${ms.length?ms.map(x=>`<button class="message-card ${m?.id===x.id?'active':''}" data-action="message-select" data-id="${x.id}"><div class="between"><span class="tiny muted">${esc(x.from)} → ${esc(x.to)}</span>${badge(...messageStatus(x))}</div><h4>${esc(x.title)}</h4><p>#${x.task}${x.pr?' · PR #'+x.pr:''} · ${esc(x.at)}</p></button>`).join(''):'<div class="empty"><p>没有匹配的消息</p></div>'}</section><section class="card message-content">${m?messageDetail(m):`<div class="empty">${icon('message')}<h3>暂时没有待处理消息</h3><p>可以切换筛选，或发起一次有明确对象的交接。</p></div>`}</section></div>`;}
function messageDetail(m){const from=actor(m.from),to=actor(m.to),a=m.artifact?s.artifacts[m.artifact]:null;return `<div class="between"><div class="row">${badge(m.type==='artifact'?'固定产物交付':m.type==='notice'?'范围内通知':'工作请求',m.type==='artifact'?'purple':'')}${badge('#'+m.task)}</div>${badge(...messageStatus(m))}</div><h2 class="message-title">${esc(m.title)}</h2><div class="message-routing">${avatar(from.engine,true)}<span>${esc(from.role)}</span>${icon('arrow',true)}${avatar(to.engine,true)}<span>${esc(to.role)}</span></div><p class="msg-body">${esc(m.body)}</p><div class="row source-line">${m.pr?btn(icon('pr',true)+'查看原 PR #'+m.pr,'pr',m.pr,'sm'):btn('查看原 Issue','issue',m.task,'sm')}${btn(icon('terminal',true)+'接收现场','session',m.to,'ghost sm',!S(m.to))}<span class="tiny muted">${m.id} · 固定收件会话</span></div>${m.status==='unknown'?`<div class="notice amber space-top">${icon('alert')}<div>原投递已发出，尚未确认送达。<br>先核查同一消息，不重新发送，也不开替代会话。</div></div><div class="space-top">${btn('核查原投递','message-check',m.id,'soft')}</div>`:m.status==='pending'?`<div class="space-top">${btn('投递到已关联会话','message-send',m.id,'soft')}</div>`:''}${a?artifactPanel(a,m):''}${m.reply?`<div class="reply-box"><div class="row">${avatar(actor(m.replyBy||m.to).engine,true)}<b class="small">${m.replyBy==='owner'?'你的回复':'接收方回复'}</b><span class="tiny muted">${esc(m.replyAt||m.at)}</span></div><p>${esc(m.reply)}</p></div>`:''}<div class="reply-form"><h3>只回复下一步需要知道的内容</h3><textarea id="reply-text" aria-label="回复交接" placeholder="说明已核对什么、还缺什么，或引用原 PR 的结论。"></textarea><div class="between"><span class="tiny muted">以“你”的身份回复，不代替 Agent 的验证证据</span>${btn('发送回复 '+icon('send',true),'reply',m.id,'primary')}</div></div>`;}
function artifactPanel(a,m){const stage={registered:0,received:1,verified:2}[a.state]??0;return `<section class="artifact-card"><div class="between"><div class="row">${icon('box')}<div><h3>${esc(a.name)}</h3><div class="mono muted" style="margin-top:4px">${esc(a.version)} · ${esc(a.hash)}</div></div></div>${badge(a.state==='verified'?'已验证':a.state==='received'?'已接收':'已登记',a.state==='verified'?'green':'')}</div><div class="artifact-steps">${[['登记','提供方确认产物存在'],['接收','读取并核对版本'],['验证','从真实消费入口检查']].map(([n,d],i)=>`<div class="artifact-step ${stage>=i?'done':''}"><b>${stage>=i?'✓':i+1} ${n}</b><small>${d}</small></div>`).join('')}</div><p class="small sub">${a.evidence?esc(a.evidence):'消息已送达不代表输入已验证。消费端需要单独核对期间、单位和来源。'}</p><div class="between wrap" style="margin-top:14px">${a.state==='registered'?btn('接收并核对版本','artifact-receive',a.id,'primary',!['delivered','replied'].includes(m.status)):a.state==='received'?btn('运行消费验证','artifact-verify',a.id,'primary'):btn('查看消费证据','artifact-evidence',a.id,'soft')}${btn('查看产物清单','artifact-evidence',a.id,'ghost sm')}</div></section>`;}
function syncOverlay(){document.body.style.overflow=drawer||modal?'hidden':'';}
function openDrawer(type,id,tab='overview'){drawerFocus=document.activeElement;drawer={type,id,tab};$('#drawer-shade').hidden=false;$('#drawer').hidden=false;renderDrawer();syncOverlay();$('#drawer').focus();}
function closeDrawer(){drawer=null;$('#drawer-shade').hidden=true;$('#drawer').hidden=true;syncOverlay();if(drawerFocus?.isConnected)drawerFocus.focus();}
function renderDrawer(){if(!drawer)return;const {type,id,tab}=drawer;let head='',tabs='',body='',foot='';if(type==='pr'){const p=P(id);if(!p)return closeDrawer();head=`<div class="drawer-topline">${icon('pr',true)}<span>交付详情 / PR #${p.id}</span>${badge(...labelFor(p))}<span class="spacer"></span>${btn(icon('close'),'drawer-close','','ghost iconbtn',false,'aria-label="关闭详情"')}</div><h2>${esc(p.title)}</h2><div class="row wrap"><code>${esc(p.source)}</code>${icon('arrow',true)}<code>${esc(p.target)}</code><span class="spacer"></span><span class="tiny muted">head <span class="mono">${short(p.head)}</span></span>${btn('原 PR '+icon('external',true),'source-pr',id,'ghost sm')}</div>`;tabs=[['overview','交付与条件'],['evidence','验证与证据'],['review','审核与修复'],['history','交接历史']].map(([v,t])=>`<button data-action="drawer-tab" data-id="${v}" class="${tab===v?'active':''}">${t}${v==='review'&&p.findings.some(f=>f.state!=='closed')?' · '+p.findings.filter(f=>f.state!=='closed').length:''}</button>`).join('');body=({overview:prOverview,evidence:prEvidence,review:prReview,history:prHistory}[tab]||prOverview)(p);foot=prFooter(p);
 }else if(type==='issue'){const t=T(id),a=S(t.owner),parent=t.parent?T(t.parent):t;head=`<div class="drawer-topline">${icon('tree',true)}<span>${t.parent?'子任务':'顶层目标'} / Issue #${t.id}</span><span class="spacer"></span>${btn(icon('close'),'drawer-close','','ghost iconbtn',false,'aria-label="关闭详情"')}</div><h2>${esc(t.title)}</h2><div class="row wrap">${badge(t.scope)}${badge(t.parent?'属于 #'+t.parent:parent.target==='main'?'独立合入':'按需要组合交付',t.id===50?'purple':'')}${a?engineTag(a.engine):badge('尚未分配','amber')}</div>`;tabs=[['overview','交付范围'],['acceptance','共同验收'],['history','任务活动']].map(([v,n])=>`<button data-action="drawer-tab" data-id="${v}" class="${tab===v?'active':''}">${n}</button>`).join('');body=issueDetail(t,tab);foot=`<div><b class="small">${a?esc(a.role):'尚无实施者'}</b><p>${t.pending?'原派发回执待核查；不重复创建会话':t.mode==='joined'?'顺序进入现有会话，不新增写入进程':'按已采用范围派发与交付'}</p></div><div class="actions">${t.pr?btn('查看 PR #'+t.pr,'pr',t.pr):a?btn('执行现场','session',a.id):''}${!t.owner?btn('分配这项任务','assign',t.id,'primary'):!t.pr&&t.parent?btn('登记交付 PR','register-pr',t.id,'primary'):btn('联系负责人','compose',t.id,'primary')}</div>`;
 }else if(type==='session'){const a=S(id);if(!a)return closeDrawer();head=`<div class="drawer-topline">${icon('terminal',true)}<span>执行现场 / ${esc(a.id)}</span>${status(a.state)}<span class="spacer"></span>${btn(icon('close'),'drawer-close','','ghost iconbtn',false,'aria-label="关闭详情"')}</div><h2>${esc(a.role)}</h2><div class="row">${avatar(a.engine)}<div><b class="small">${a.engine}</b><p class="tiny muted">顶层 #${a.top} · 第 ${a.turn} 轮</p></div></div>`;body=sessionDetail(a);foot=`<div><b class="small">${a.state==='unknown'?'先核查原执行者':'准确定位原会话'}</b><p>未知不新建替身；本轮空闲不代表交付完成</p></div><div class="actions">${btn('复制定位信息','copy-session',a.id)}${a.state==='unknown'?btn('核查原会话','probe',a.id,'primary'):a.state==='running'&&a.caps.includes('pause')?btn('请求暂停','pause',a.id):['paused','terminated'].includes(a.state)&&a.caps.includes('resume')?btn('接续原任务','resume',a.id,'primary'):a.state==='idle'&&a.todos.length?btn('处理下一项待办','next-todo',a.id,'primary'):btn('发送工作请求','compose-session',a.id,'primary',!a.caps.includes('send'))}</div>`;
 }
 $('#drawer').innerHTML=`<header class="drawer-head">${head}</header>${tabs?`<nav class="drawer-tabs" aria-label="详情页标签">${tabs}</nav>`:''}<div class="drawer-body" id="drawer-body">${body}</div><footer class="drawer-footer">${foot}</footer>`;
}
function stagebar(p){const version=p.merged?.sha||p.head;const states=[true,p.selfReview,reviewFresh(p)&&p.review.verdict==='PASS',p.findings.length? p.findings.every(f=>f.state==='closed'):reviewFresh(p)&&p.review.verdict==='PASS',!!p.merged,!!p.report&&p.report.version===version,p.acceptance?.version===version&&p.acceptance.result==='accept'];const names=['实施','自审 / PR','独立审查','核实 / 修复','合入目标','技术解读','用户验收'];const current=states.findIndex(x=>!x);return `<div class="stagebar">${names.map((t,i)=>`<button class="stage ${states[i]?'done':i===current?'now':''}" data-action="stage" data-id="${p.id}:${i}"><span class="rail"></span><span>${t}</span></button>`).join('')}</div>`;}
function prOverview(p){const checks=requirements(p);return stagebar(p)+`<section class="next-step"><div class="up">NEXT / ${esc(nextOwner(p)[0])}</div><h3>${p.merged?'本次合入已确认':esc(labelFor(p)[0])}</h3><p>${esc(nextStep(p))}</p></section><div class="detail-grid"><div><h3 style="margin-bottom:9px">本次真正交付什么</h3><p class="small sub" style="line-height:1.9">${esc(p.summary)}</p><div class="row" style="margin:13px 0 21px">${btn('Issue #'+p.issue+' · 已采用范围','issue',p.issue,'ghost sm')}${badge(p.scope)}</div><div class="checks-title"><h3>合入前需要成立的事实</h3><span class="tiny muted">${checks.filter(c=>c.ok).length} / ${checks.length} 已核对</span></div>${checks.map(c=>`<div class="check-row"><span class="check-mark ${c.ok?'':'wait'}">${icon(c.ok?'check':'clock',true)}</span><div class="grow"><h4>${c.title}</h4><p>${esc(c.detail)}</p></div>${!c.ok?checkAction(p,c):''}</div>`).join('')}${p.decisions.some(id=>s.decisions[id].state==='confirmed'&&s.decisions[id].implementedAt!==p.head)?`<div class="notice green space-top">${icon('info')}<span>决定仍然有效。这里只需核对新版本是否落实，不必让你再选一次。</span></div>`:''}</div><aside class="stack"><section class="card pad"><div class="detail-label">本次实际合入</div><div class="row" style="margin-bottom:17px">${icon('branch')}${badge(p.target,p.target==='main'?'green':'purple')}</div><dl class="meta-list"><dt>最终出口</dt><dd>${p.target==='main'?'main':p.target+' → main'}</dd><dt>当前 head</dt><dd class="mono">${short(p.head)}</dd><dt>观测目标</dt><dd class="mono">${short(s.branches[p.target])}</dd><dt>受测组合</dt><dd class="mono">${p.tests?short(p.tests.tree):'未生成'}</dd><dt>Draft</dt><dd>${p.draft?'是 · Ready 不等于 PASS':'否'}</dd><dt>Git 冲突</dt><dd>${p.conflict?'存在冲突':'未观察到冲突'}</dd></dl>${p.draft?btn('标记 Ready','ready',p.id,'soft sm space-top'):''}</section><section class="card pad"><div class="between"><h3>执行与授权</h3>${icon('shield',true)}</div><p class="small sub" style="margin:10px 0">${esc(permission(p).label)} · ${s.mode==='delegated'?'接收角色':'项目负责人'}</p><p class="tiny muted" style="line-height:1.9">${esc(permission(p).detail)}</p><div class="sep"></div><div class="row">${avatar(authorOf(p)?.engine||'Codex',true)}${link(esc(authorOf(p)?.id||'未关联')+' · 原生现场','session',authorOf(p)?.id||'cx-A')}</div>${link('查看授权边界 '+icon('arrow',true),'settings','authorization')}</section></aside></div>`;}
function checkAction(p,c){if(c.id==='decisions'){const d=p.decisions.find(id=>s.decisions[id].state!=='confirmed');return btn(d?'决定':'核对落实',d?'decision':'apply-decision',d||p.id,'ghost sm');}if(c.id==='tests')return btn('验证','test',p.id,'ghost sm',!!pending('test',p.id));if(c.id==='review')return btn('查看','drawer-tab','review','ghost sm');if(c.id==='deps')return btn('查看','show-deps',p.id,'ghost sm');if(c.id==='target')return btn('核对','target',p.id,'ghost sm');if(c.id==='records')return btn('补交接','record',p.id,'ghost sm');if(c.id==='acceptance')return btn('验收','acceptance',p.id,'ghost sm');return '';}
function prFooter(p){const op=pending('merge',p.id);let actions='';if(p.merged)actions=btn('技术解读','report',p.id)+btn('用户验收','acceptance',p.id,'primary');else if(op)actions=btn(op.state==='unknown'?'核查原合入请求':'正在读取合入回执','merge-check',p.id,'primary',op.state!=='unknown');else if(p.phase==='accepted')actions=btn('查看交接包','handoff',p.id)+btn(eligible(p)?(permission(p).ok?(permission(p).manual?'确认本次合入':'按委托合入'):'查看权限'):'补齐合入条件',eligible(p)?'merge':'conditions',p.id,'primary');else if(p.phase==='rework')actions=btn('查看退回条件','drawer-tab','review')+btn('核实并接续修复','fix',p.id,'primary',!!pending('fix',p.id));else if(p.phase==='receiving')actions=btn('退回 / 补证据','return',p.id)+btn('登记接收结论','receive-verdict',p.id,'primary');else if(p.phase==='working')actions=btn('原生现场','session',authorOf(p)?.id||'cx-A')+btn('提交接收','submit-reception',p.id,'primary');else actions=btn('查看交接包','handoff',p.id)+btn('开始接收','receive',p.id,'primary',!!pending('receive',p.id));return `<div><b class="small">${p.merged?'已进入 '+esc(p.merged.target):'下一步 · '+esc(nextOwner(p)[0])}</b><p>${p.merged?'合入不自动代表业务采纳':s.mode==='readonly'?'只读模式不执行远端写动作':receiveCount()+' / '+s.slots+' 接收席位 · 操作结果须核查'}</p></div><div class="actions">${actions}</div>`;}
function prEvidence(p){const run=s.runs.find(r=>r.pr===p.id&&r.kind==='test'&&['running','unknown'].includes(r.state));return `<div class="between" style="margin-bottom:16px"><div><h3>针对哪个版本，证明了什么</h3><p class="tiny muted" style="margin-top:5px">运行成功、内容正确和覆盖完整分别展示。</p></div>${btn(icon('test',true)+'运行组合验证','test',p.id,'primary',!!run)}</div>${run?`<div class="notice ${run.state==='unknown'?'amber':''}">${run.state==='running'?'<span class="spinner"></span>':icon('alert')}<div><b>${run.state==='running'?'正在检查固定组合':'原检查结果待核查'}</b><div>${esc(run.detail)}</div></div></div>${run.state==='running'?'<div class="progress-running"></div>':btn('核查原验证','test-check',p.id,'soft space-top')}`:''}${p.tests?`<article class="evidence-card"><div class="between"><div class="row">${icon('test')}<h3>公司链组合检查</h3></div>${badge(testFresh(p)?p.tests.result==='pass'?'当前证据 · 通过':'当前证据 · 未通过':'历史证据 · 待核对',testFresh(p)&&p.tests.result==='pass'?'green':'amber')}</div><div class="cmd">python tools/check_company_chain.py --source fixed-samples --candidate ${short(p.tests.head)}</div><div class="evidence-metrics"><div><b>${p.tests.count}</b><small>本轮场景</small></div><div><b>${p.tests.passed}</b><small>通过断言</small></div><div><b>${p.tests.count-p.tests.passed}</b><small>待处理失败</small></div></div><dl class="meta-list"><dt>候选</dt><dd class="mono">${short(p.tests.head)} + ${short(p.tests.base)} → ${short(p.tests.tree)}</dd><dt>输入范围</dt><dd>${esc(p.tests.inputs)}</dd><dt>工具版本</dt><dd class="mono">${esc(p.tests.tool)}</dd><dt>验证者</dt><dd>独立接收现场 · 不复用作者工作区</dd><dt>限制</dt><dd>固定样例与所列入口；不是全量原件普查或业务采纳。</dd></dl><div class="between" style="margin-top:15px"><span class="tiny muted">${p.tests.at} · 示例执行证据</span>${btn('查看原始输出','raw-evidence',p.id,'sm')}</div></article>`:`<div class="empty">${icon('test')}<h3>当前还没有组合证据</h3><p>固定 main 与候选，在隔离现场验证，不修改作者分支。</p></div>`}<div class="card pad"><h3>本轮输入与输出关系</h3><div class="row wrap" style="margin:14px 0">${badge('固定来源')}${icon('arrow',true)}${badge('真实计算入口')}${icon('arrow',true)}${badge('保存与复跑')}${icon('arrow',true)}${badge('独立 CSV 读取')}</div><p class="small sub">保留原始来源、字段范围和失败原因。未比较的样本单独显示，不算作“没有变化”。</p></div>`;}
function prReview(p){const run=pending('review',p.id);return `<div class="between" style="margin-bottom:17px"><div><h3>独立判断，不继承作者对话</h3><p class="tiny muted" style="margin-top:5px">审核结论绑定 head 与采用范围；新的实质证据可重新判断。</p></div>${btn(icon('play',true)+'运行独立审核','review',p.id,'primary',!!run)}</div>${run?`<div class="notice">${run.state==='unknown'?icon('alert'):'<span class="spinner"></span>'}<span>${run.state==='unknown'?'上次审核回执待核查':'独立 Codex 正在读取固定差异与原始证据'}</span></div>${run.state==='unknown'?btn('核查原审核','review-check',p.id,'soft space-top'):''}`:''}${p.review?`<article class="evidence-card"><div class="between"><div class="row">${avatar('Codex')}<div><h3>${esc(p.review.who)}</h3><p class="tiny muted">${p.review.at} · ${short(p.review.head)}</p></div></div>${badge(p.review.verdict+(reviewFresh(p)?'':' · 历史'),reviewFresh(p)&&p.review.verdict==='PASS'?'green':p.review.verdict==='REWORK_REQUIRED'?'red':'amber')}</div><p class="small sub" style="margin-top:13px">${p.review.verdict==='PASS'?'在所列范围内没有开放阻断问题。必要检查、依赖、决定和合入授权仍须各自满足。':p.review.verdict==='OWNER_DECISION_REQUIRED'?'实现可继续独立部分，但历史缺源的产品处理尚待明确。决定不能由两模型合意替你作出。':'已核实的行为与采用契约不一致。按以下有限条件修复；非阻断建议不扩大本次范围。'}</p></article>`:''}${p.findings.map(f=>`<article class="finding"><div class="between"><div class="row">${badge(f.severity,f.state==='closed'?'green':'red')}${badge(f.id)}</div>${badge(f.state==='closed'?'复核已通过':f.state==='fixed'?'修复已提交 · 待复核':'必须修复',f.state==='closed'?'green':'amber')}</div><h3>${esc(f.title)}</h3><p>${esc(f.text)}</p><div class="notice space-top"><div><b>有限通过条件</b><br>${esc(f.condition)}</div></div></article>`).join('')||`<div class="notice green">${icon('check')}<span>当前没有已登记的代码阻断问题。没有 finding，不等于所有交付条件都已满足。</span></div>`}<section class="card pad space-top"><div class="between"><h3>保留已经成立的证据</h3>${badge('增量复核')}</div><p class="small sub" style="margin:10px 0">接口格式、其他有效结果与来源引用已核对。仅在变化影响其前提时重验；不要求作者为同一内容反复报到。</p><div class="row wrap">${btn('退回并写明通过条件','return',p.id,'sm')}${p.phase==='rework'?btn('接续已核实修复','fix',p.id,'soft sm',!!pending('fix',p.id)):''}</div></section>`;}
function prHistory(p){const rows=[...p.history];return `<div class="between" style="margin-bottom:20px"><div><h3>原 PR 上的完整交接</h3><p class="tiny muted" style="margin-top:5px">当前摘要可更新，过去针对哪个版本作出的判断仍可查。</p></div>${btn(icon('copy',true)+'复制当前交接包','copy-handoff',p.id,'sm')}</div>${rows.map(e=>`<div class="history-entry"><div class="between"><h4>${esc(e.title)}</h4><small>${esc(e.at)}</small></div><p>${esc(e.text)}</p><small class="mono">${short(e.head)} · ${esc(e.kind||'action')}</small></div>`).join('')||'<div class="empty">尚未产生交接记录</div>'}`;}
function issueDetail(t,tab){const a=S(t.owner),parent=t.parent?T(t.parent):t;if(tab==='history'){const events=s.events.filter(e=>e.task===t.id||e.pr&&P(e.pr)?.issue===t.id);return events.length?events.map(e=>`<div class="history-entry"><h4>${esc(e.title)}</h4><p>${esc(e.text)}</p><small>${esc(e.at)}</small></div>`).join(''):'<div class="empty">当前无额外任务活动；范围和已有交付仍可查看。</div>';}
 if(tab==='acceptance')return `<div class="notice">${icon('link')}<span>采用自 Issue #${t.id} 的共同验收。这里只引用，不另建一份可自由改写的需求。</span></div>${[['共同交付',t.goal],['必须保持一致','金额携带单位与期间；结果保留原文出处；不能确定时返回准确限制，不用其他范围的成功顶替。'],['谁证明什么成立','实现者验证局部行为；使用方验证消费入口；接收者复核组合和独立反例。'],['材料与入口','source-pack-v2 的固定样例由双方共同读取。正常、缺源和错误版本均有明确结果。'],['允许与不允许的变化','本次范围内的修正需要解释；其他有效结果和来源不被覆盖。失败变成功与成功变失败都核对内容。'],['交付出口',parent.target==='main'?'子改动能独立工作时分别合入 main。所有子任务完成不自动关闭父目标。':'历史组件在 integration/50 验证真实组合，再独立接收进入 main。']].map(([h,p])=>`<div class="scope-section"><h3>${h}</h3><p>${esc(p)}</p></div>`).join('')}`;
 return `<section class="next-step"><div class="up">DELIVERABLE</div><h3>${esc(t.goal)}</h3><p>已采用范围 ${esc(t.scope)} · 本次只交付这里承诺的行为。</p></section><div class="detail-grid"><div><h3 style="margin-bottom:12px">实现与交付</h3>${t.pr?`<button class="path-card" data-action="pr" data-id="${t.pr}"><div class="between"><b>PR #${t.pr} · ${esc(P(t.pr).title)}</b>${badge(...labelFor(P(t.pr)))}</div><p>${esc(P(t.pr).source)} → ${esc(P(t.pr).target)}</p></button>`:`<div class="notice">${icon('info')}<span>${t.parent?'尚无 PR，可以先分配已批准的任务；完成后在原 PR 交接。':'这是共同目标；具体交付由子任务和对应 PR 承担。'}</span></div>`}<div class="scope-section"><h3>下一步责任</h3><p>${a?`${a.role}（${a.id}）承担实现与交接。${t.mode==='joined'?'该子任务在负责人会话里顺序处理。':'修改范围与其他执行现场分开。'}`:'等待分配给新会话，或排入现有负责人待办。'}</p></div><div class="scope-section"><h3>范围之外</h3><p>不改变业务采纳规则、不新增付费获取、不删除原始材料，也不扩大分支写入权限。</p></div><div class="row space-top">${btn('查看共同验收','drawer-tab','acceptance','soft')}</div></div><aside class="stack"><section class="card pad"><h3 style="margin-bottom:16px">工作项映射</h3><dl class="meta-list"><dt>所属目标</dt><dd>#${parent.id} ${esc(parent.title)}</dd><dt>实际目标</dt><dd><code>${esc(parent.target)}</code></dd><dt>负责人</dt><dd>${a?esc(a.id):'尚未分配'}</dd><dt>工作区</dt><dd class="mono">${a?esc(a.workspace):'派发时确定'}</dd><dt>安排</dt><dd>${t.mode==='joined'?'并入现有待办':t.mode==='separate'?'独立会话':t.parent?'未决定':'顶层责任'}</dd></dl></section></aside></div>`;
}
function sessionDetail(a){const ops=s.ops.filter(o=>o.target===a.id||(o.kind==='dispatch'&&T(o.target)?.owner===a.id));return `<section class="next-step"><div class="up">LATEST NATIVE EVENT</div><h3>${esc(a.event)}</h3><p>${a.state==='unknown'?'保留原会话与工作区，先核查是否仍在执行。':'当前轮次和交付状态分别记录；空闲不是已完成。'}</p></section><div class="detail-grid"><div><h3 style="margin-bottom:14px">准确执行现场</h3><dl class="meta-list"><dt>原生会话</dt><dd class="mono">${esc(a.native||'等待创建回执')}</dd><dt>所在机器</dt><dd>demo-local · 本地示例</dd><dt>工作区</dt><dd class="mono">${esc(a.workspace)}</dd><dt>源分支</dt><dd class="mono">${esc(a.branch)}</dd><dt>当前轮次</dt><dd>turn-${a.turn}</dd><dt>具体能力</dt><dd><div class="taglist">${a.caps.map(c=>badge(({observe:'读取事件',send:'定向投递',pause:'请求暂停',resume:'指定接续'})[c])).join('')||badge('尚待连接验证','amber')}</div></dd></dl><div class="sep"></div><h3>顺序待办</h3>${a.todos.length?a.todos.map(id=>`<div class="wait-item"><div class="between"><span class="small">#${id} ${esc(T(id).title)}</span>${badge('排入原会话')}</div></div>`).join(''):'<p class="small muted" style="margin-top:10px">当前没有额外待办。新工作不会以另一写入者进入同一现场。</p>'}<div class="sep"></div><h3>关联工作项</h3><div class="row wrap space-top">${(a.tasks.length?a.tasks:[a.top]).map(id=>btn('#'+id+' '+esc(T(id).title),'issue',id,'sm')).join('')}</div></div><aside class="stack"><section class="card pad"><h3>控制边界</h3><p class="small sub" style="margin:10px 0;line-height:1.9">仅开放已经验证的操作。请求暂停后需要取得回执；不能通过关闭页面或超时释放写入责任。</p><p class="tiny muted">原生内部子代理由原生工具管理，平台不虚构数量和状态。</p></section><section class="card pad"><h3>最近操作</h3>${ops.slice(0,3).map(o=>`<div class="wait-item"><b class="tiny">${esc(o.kind)} · ${esc(o.id)}</b><p>${esc(o.detail)}</p>${badge(opLabel(o.state),o.state==='confirmed'?'green':'amber')}</div>`).join('')||'<p class="small muted" style="margin-top:12px">尚无新的受管操作。</p>'}</section></aside></div>`;}
function opLabel(state){return ({pending:'已登记',sent:'请求已发送',running:'执行中',confirmed:'已核查',failed:'未执行 / 被拒绝',unknown:'结果待核查'})[state]||state;}
function openModal(title,body,foot='',kicker='同序 / 操作',wide=false,data={}){previousFocus=document.activeElement;modal={...data,title};$('#dialog-title').textContent=title;$('#dialog-kicker').textContent=kicker;$('#dialog-body').innerHTML=body+'<div id="form-error" class="form-error" role="alert" hidden></div>';$('#dialog-footer').innerHTML=foot||`<span>原型使用虚构数据，不调用外部系统。</span><div class="actions">${btn('完成','modal-close')}</div>`;$('#dialog').classList.toggle('wide',wide);$('#dialog-shade').hidden=false;syncOverlay();$('#dialog').focus();}
function closeModal(){modal=null;$('#dialog-shade').hidden=true;syncOverlay();if(previousFocus?.isConnected)previousFocus.focus();}
function footerHint(text,primary,secondary=btn('取消','modal-close')){return `<span>${text}</span><div class="actions">${secondary}${primary}</div>`;}
function receiveModal(p){if(p.phase==='receiving'){drawer.tab='overview';renderDrawer();return;}if(s.mode==='readonly'){return openModal('只读模式：先查看交接建议',`<div class="notice">${icon('eye')}<span>当前不占用接收席位、不写回原 PR。固定材料与交接建议仍可查看。</span></div>`,footerHint('切换模式仅改变本地原型。',btn('查看交接包','handoff',p.id),'') );}if(receiveCount()>=s.slots)return openModal('接收席位已满',`<div class="notice amber">${icon('clock')}<span>当前 ${receiveCount()} / ${s.slots} 个席位正在使用。等待不会中断已运行的验收；可以先处理退回项或查看现有席位。</span></div>`,footerHint('不因队列积压扩大执行并发。',btn('查看队列设置','queue-settings'),'') );openModal('开始接收这次交付',`<div class="row">${avatar('Claude Code')}<div><h3>接收方 Claude</h3><p class="tiny muted">独立现场 · 不继承作者工作对话</p></div></div><div class="confirmation-box"><h3>PR #${p.id} · ${esc(p.title)}</h3><p class="mono sub" style="margin-top:9px">${short(p.head)} → ${esc(p.target)}@${short(s.branches[p.target])}</p></div><p class="small sub">接收范围：核对交付事实、有效证据与剩余限制。需要验证时使用固定候选，不修改作者分支。</p>`,footerHint(`当前 ${receiveCount()} / ${s.slots} 个席位 · 取得回执后才标为接收中`,btn('开始接收','receive-confirm',p.id,'primary')),'交付接收 / 固定对象',false,{kind:'receive',id:p.id,head:p.head});}
function verdictModal(p){if(p.phase!=='receiving')return toast('先进入接收，再登记本轮结论。','info');const blocked=requirements(p).filter(c=>!c.ok);openModal('登记本轮接收结论',`<div class="notice ${blocked.length?'amber':'green'}">${icon(blocked.length?'alert':'check')}<span>${blocked.length?`当前仍有 ${blocked.length} 项条件缺失，只能退回或要求补证据。`:'当前候选的必要事实齐备。接收判断仍要说明接受的范围和限制。'}</span></div><div style="margin-top:15px"><label class="choice"><input type="radio" name="verdict" value="accept" ${blocked.length?'disabled':'checked'}><div><strong>接受这次交付</strong><p>进入按授权合入的队列；不表示已合入或业务采纳。</p></div></label><label class="choice"><input type="radio" name="verdict" value="evidence" ${blocked.length?'checked':''}><div><strong>需要补充证据</strong><p>指出缺哪项证明、由谁补充，保留已成立的部分。</p></div></label><label class="choice"><input type="radio" name="verdict" value="rework"><div><strong>退回有限修正</strong><p>写明已确认问题和可判定的通过条件。</p></div></label></div><label class="field"><span>本轮接受范围或需要补充的内容</span><textarea id="verdict-note">${blocked.length?'请补齐：'+blocked.map(c=>c.title).join('；')+'。其他已核对证据保留。':'接受本次采用范围内的实现与证据。固定样例验证不等于全量业务采纳；没有新增付费或部署授权。'}</textarea></label>`,footerHint('只绑定本轮候选 '+short(p.head),btn('保存并交给下一步','verdict-confirm',p.id,'primary')),'原 PR / 接收记录',false,{kind:'verdict',id:p.id,head:p.head});}

function newHead(p){if(p.merged)return false;const old=p.head;p.head=hex('a'+p.id.toString(16)+(++s.seq).toString(16).padStart(4,'0'));p.recordHead=null;if(p.source.startsWith('integration/'))s.branches[p.source]=p.head;history(p,'新的提交到达',`${short(old)} → ${short(p.head)}。旧判断保留，实施证据和当前候选需重新对应。`,'version');return true;}
function runTest(p){if(pending('test',p.id))return toast('原验证尚未结束或结果未知，请核查原记录。','clock');const op=operation('test',p.id,'固定候选组合，调用已有检查入口。');op.state='running';op.record={head:p.head,base:s.branches[p.target],scope:p.scope,tree:hex('c'+p.id.toString(16)+(++s.seq).toString(16)),result:s.prototype.verification,count:12,passed:s.prototype.verification==='pass'?12:11,at:time(),tool:'check-company-chain@r3',inputs:'source-pack-v2 · 3 组固定样例'};const run={id:'RUN-'+(++s.seq),pr:p.id,kind:'test',op:op.id,state:'running',detail:'已固定 '+short(p.head)+' + '+short(op.record.base)+'；不会修改作者工作区。'};s.runs.push(run);if(drawer)drawer.tab='evidence';closeModal();render();toast('组合验证已登记，正在读取示例执行结果。');later(()=>{run.detail='独立现场完成 12 个场景，正在核对输入和输出身份。';},550);later(()=>completeTest(op),1350);}

function runReview(p){if(pending('review',p.id))return toast('已有未确认的审核，不重复启动。','clock');const op=operation('review',p.id,'新的独立 Codex 审核固定候选。');op.state='running';op.head=p.head;op.scope=p.scope;op.result=p.decisions.some(id=>s.decisions[id].state!=='confirmed')?'OWNER_DECISION_REQUIRED':p.findings.some(f=>f.state==='open')?'REWORK_REQUIRED':'PASS';op.findings=p.findings.filter(f=>f.state==='fixed').map(f=>f.id);s.runs.push({id:'RUN-'+(++s.seq),kind:'review',op:op.id,pr:p.id,state:'running',detail:'只读独立输入，不继承作者对话。'});closeModal();if(drawer)drawer.tab='review';render();later(()=>completeReview(op),1250);}
function completeReview(op){const p=P(op.target),r=s.runs.find(r=>r.op===op.id);if(r)r.state='completed';const review={head:op.head,scope:op.scope,verdict:op.result,who:'独立 Codex',at:time(),evidence:'本轮固定材料与最小复现'};if(p.head===op.head&&p.scope===op.scope){p.review=review;if(op.result==='PASS')for(const f of p.findings)if(op.findings.includes(f.id)&&f.state==='fixed')f.state='closed';if(op.result==='REWORK_REQUIRED')p.phase='rework';}finish(op,op.result+' @ '+short(op.head));history(p,'独立审核返回 '+op.result,`受审 ${short(op.head)}${p.head!==op.head?'，只归档历史':'，不自动改变 Draft 或合入状态'}。`,'review');toast('审核已返回：'+op.result);}

 'target':id=>{const p=P(+id);openModal('核对实际目标与采用安排',`<div class="notice amber">${icon('branch')}<span>GitHub 的实际目标决定本次操作更新哪条分支。声明过叠放不代表目标一定正确。</span></div><dl class="meta-list space-top"><dt>实际目标</dt><dd><code>${esc(p.target)}</code></dd><dt>采用目标</dt><dd><code>${esc(p.plannedTarget)}</code></dd><dt>最终出口</dt><dd>main</dd></dl>`,footerHint('先核对，不能让旧确认直接换一个目标。',btn('按采用安排更正示例目标','target-confirm',p.id,'primary')));},
 'target-confirm':id=>{const p=P(+id);p.target=p.plannedTarget;history(p,'实际目标已按采用安排更正','新的合入动作仍需核对条件；旧确认不自动使用。','target');closeModal();render();},
 'settings':id=>settings(id||'connections'),'queue-settings':queueSettings,
 'queue-save':()=>{const slots=+$('#queue-slots').value,id=$('#queue-pr').value,reason=$('#queue-reason').value.trim();if(slots<receiveCount())return formError('新上限不能低于正在处理的数量；请先正常完成或交回队列。');if(id&&!reason)return formError('调整优先级需要说明原因，不能把所有任务都设最高。');s.slots=slots;if(id){P(+id).priority='expedite';P(+id).priorityReason=reason;history(P(+id),'队列优先级已调整',reason,'priority');}closeModal();render();toast('队列安排已保存，正在运行的工作没有中断。');},
 'release-slot':id=>{const p=P(+id);if(pending('test',p.id)||pending('review',p.id))return formError('实际验证或审核未结束，不在这里中断和释放席位。');p.phase='queued';history(p,'接收工作交回队列','保留已验证内容，下一位接收者可从原记录继续。','handoff');queueSettings();render();},
 'prototype-save':()=>{s.mode=$('#proto-mode').value;s.prototype.nextMerge=$('#proto-merge').value;s.prototype.verification=$('#proto-verification').value;closeModal();render();toast('本地原型设置已更新，不改变任何真实权限。');},
 'prototype-head':id=>{if(!newHead(P(+id)))return formError('该示例已合入，请重置后体验候选变化。');closeModal();render();openDrawer('pr',+id);toast('新 head 已到达，旧证据留在历史。','info');},
 'prototype-artifact':()=>{s.artifacts.A1.actualVersion='source-pack-v1';s.artifacts.A1.state='registered';s.artifacts.A1.evidence=null;closeModal();actions.message('M1');toast('示例输入版本已改变，接收时会明确拒绝。','info');},
 'prototype-artifact-restore':()=>{s.artifacts.A1.actualVersion=s.artifacts.A1.version;s.artifacts.A1.state='registered';s.artifacts.A1.evidence=null;closeModal();actions.message('M1');toast('期望版本已恢复，可重新接收。');},
 'prototype-target':id=>{const p=P(+id);if(p.merged)return formError('示例已经合入，请重置后体验。');p.target=p.target==='main'?'integration/50':'main';closeModal();render();openDrawer('pr',+id);toast('实际目标已变化，旧采用安排不能直接放行。','alert');},
 'revoke':()=>openModal('撤销示例技术委托？','<p class="small sub">停止新的受委托合入。已经发送的请求仍要查询实际结果，不能把撤销当作从未发生。</p>',footerHint('仅影响本地演示授权。',btn('撤销委托','revoke-confirm','','danger'))),
 'revoke-confirm':()=>{s.grantActive=false;event('示例委托已撤销','新的受委托写操作停止，原请求继续核查。');closeModal();render();toast('委托已撤销，没有抹去已发出的请求。');},
 'resources':()=>openModal('资源与执行权分开核对',`<div class="notice">${icon('lock')}<span>本界面不创建第二本额度账。以下是原资源入口在产品中的呈现方式。</span></div><div class="tablewrap space-top"><table class="table"><thead><tr><th>资源</th><th>状态</th><th>执行边界</th></tr></thead><tbody><tr><td>代码检查</td><td>本地隔离验证</td><td>无业务网络调用</td></tr><tr><td>历史材料获取</td><td>尚未授权</td><td>需独立范围与成本决定</td></tr><tr><td>模型业务处理</td><td>未接入原账本</td><td>不推断可用余额</td></tr><tr><td>技术合入</td><td>${esc(permission(P(102)).label)}</td><td>只对明确候选与目标</td></tr></tbody></table></div>`),
 'activity':()=>openModal('操作与实质变化',`<div class="notice">${icon('history')}<span>每条记录区分请求和结果；全部来自本地原型。</span></div><h3 style="margin:18px 0 10px">操作回执</h3>${s.ops.slice(0,15).map(o=>`<div class="setting-row"><div class="between"><b class="small">${esc(o.kind)} · ${esc(o.target)}</b>${badge(opLabel(o.state),o.state==='confirmed'?'green':o.state==='failed'?'red':'amber')}</div><p>${esc(o.detail)}</p><p class="mono">${esc(o.id)} · ${esc(o.created)}</p></div>`).join('')||'<p class="small muted">还没有新操作。</p>'}<h3 style="margin:21px 0 15px">项目事件</h3>${s.events.map(e=>`<div class="history-entry"><div class="between"><h4>${esc(e.title)}</h4><small>${esc(e.at)}</small></div><p>${esc(e.text)}</p></div>`).join('')}`,'','项目 / 可追溯交接',true),
 'export':()=>{save();download('tongxu-ui-demo-state.json',JSON.stringify({...s,exportNote:'Offline UI prototype, not production evidence'},null,2));toast('已导出当前原型状态。');},
 'reset':()=>openModal('重置这份界面原型？','<p class="small sub">清除本浏览器中的演示分配、消息、决定和合入记录，回到初始场景。不会影响任何真实服务。</p>',footerHint('仅删除本地示例操作。',btn('重置示例','reset-confirm','','danger'))),
 'reset-confirm':()=>{resetState();toast('已回到初始产品界面。');},
 'register-pr':id=>{const t=T(+id);if(!t.owner)return toast('先分配实施责任。','info');openModal('登记这项任务的代码交付',`<label class="field"><span>PR 标题</span><input id="reg-title" value="${esc(t.title)}"></label><label class="field"><span>实际源分支</span><input id="reg-source" value="task/issue-${id}"></label><label class="field"><span>实际合入目标</span><select id="reg-target"><option value="integration/50">integration/50</option><option value="main">main</option></select></label><p class="small sub">这只是示例中的交付登记；不会创建线上 PR。新交付的检查与审核状态保持未完成。</p>`,footerHint('关联原工作项，不用“已开发”自动生成 PASS。',btn('登记 Draft PR','register-pr-confirm',id,'primary')));},
 'register-pr-confirm':id=>{const t=T(+id);if(t.pr)return formError('本工作项已有交付 PR，不重复登记。');const title=$('#reg-title').value.trim(),source=$('#reg-source').value.trim(),target=$('#reg-target').value;if(!title||!source)return formError('填写标题与源分支。');const pid=200+(++s.seq),head=hex('d'+pid.toString(16));s.prs[pid]={id:pid,issue:t.id,title,source,target,plannedTarget:target,head,scope:t.scope,base:s.branches[target],phase:'queued',draft:true,conflict:false,recordHead:head,selfReview:false,review:null,tests:null,findings:[],deps:[],decisions:[],history:[],merged:null,acceptance:null,report:null,priority:'normal',summary:t.goal};t.pr=pid;history(P(pid),'Draft PR 已登记','新候选还没有独立审核与组合证据。','handoff');closeModal();render();openDrawer('pr',pid);},
};
// Manual prioritization still respects the active queue filters and all merge gates.
const ordinaryQueueEntries=queueEntries;
queueEntries=function(filter='all'){return ordinaryQueueEntries(filter).sort((a,b)=>(a.priority==='expedite'?0:1)-(b.priority==='expedite'?0:1));};
function act(action,id,el){const fn=actions[action];if(!fn){console.warn('Unknown UI action',action);return toast('该入口尚未关联有效对象。','alert');}fn(id,el);save();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;try{act(el.dataset.action,el.dataset.id||'',el);}catch(error){console.error(error);toast('这次操作未完成；当前现场保留，可重置示例。','alert');}});
document.addEventListener('change',e=>{if(e.target.id==='issue-filter'){s.issueFilter=e.target.value;render();}if(e.target.name==='assign-mode')$('#assign-workspace-field').hidden=e.target.value==='joined';if(e.target.id==='compose-type')$('#compose-artifact-field').hidden=e.target.value!=='artifact';if(e.target.id==='compose-task'){const t=T(+e.target.value),owner=t.owner||T(t.parent)?.owner;if(owner)$('#compose-to').value=owner;}});
document.addEventListener('input',e=>{if(e.target.id==='global-search')searchResults(e.target.value);});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return;}if(e.key==='Escape'){if(modal)closeModal();else if(drawer)closeDrawer();else{$('#sidebar').classList.remove('open');$('#mobile-shade').classList.remove('open');}return;}if(['Enter',' '].includes(e.key)&&e.target.matches('[role=button][data-action]')){e.preventDefault();act(e.target.dataset.action,e.target.dataset.id||'',e.target);}if(e.key==='Tab'&&(modal||drawer)){const root=modal?$('#dialog'):$('#drawer'),focusables=$$('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href],summary',root).filter(x=>x.offsetParent!==null);if(!focusables.length)return;if(e.shiftKey&&(document.activeElement===focusables[0]||document.activeElement===root)){e.preventDefault();focusables.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===focusables.at(-1)){e.preventDefault();focusables[0].focus();}}});
$('#drawer-shade').addEventListener('click',closeDrawer);$('#dialog-shade').addEventListener('click',e=>{if(e.target===$('#dialog-shade'))closeModal();});$('#mobile-shade').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobile-shade').classList.remove('open');});
window.__tongxuUI={snapshot:()=>clone(s),reset:resetState,navigate,openPR:id=>openDrawer('pr',id),openIssue:id=>openDrawer('issue',id),eligibility:id=>({eligible:eligible(P(id)),checks:requirements(P(id))}),advanceHead:id=>{newHead(P(id));render();},prototype:(mode,merge='success',verification='pass')=>{s.mode=mode;s.prototype.nextMerge=merge;s.prototype.verification=verification;render();}};
render();if(interrupted){event('原型状态已恢复',`${interrupted} 项中断操作保留为未知，没有自动重发。`);toast('中断操作已保留，需核查原回执。','info');}

$$('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
</script></body></html>
