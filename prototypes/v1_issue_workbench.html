function overview(){const ready=Object.values(s.prs).filter(p=>mergeEligibility(p).ready).length,open=Object.values(s.prs).filter(p=>!p.merged).length,unknown=Object.values(s.sessions).filter(a=>a.state==='unknown').length;return heading('PROJECT BRIEF','看清推进，也看清等待。','三个顶层 Issue 各自有负责人；平台连接任务，不接管原生编码。',B(I('download')+'导出演示状态','export'))+`<div class="demo-line">${I('info')}这是可操作的离线模板，所有任务、版本、事件与能力均为示例，不代表任何仓库最新状态。</div><div class="stack"><div class="overview-grid"><div class="stack"><article class="card hero"><div class="between"><div class="eyebrow">项目简报 · 三位负责人汇总</div>${badge('示例解读','')}</div><h2>取数已经形成可交接产物。<br>下一步是计算集成，而非再造一套工具。</h2><p>本示例把“已交付接口”“已通过检查”“可合并”和“已完成业务验收”分开。你可以继续推进独立任务，同时明确每个 PR 最终进入哪条分支。</p><div class="row wrap" style="margin-top:21px">${badge('讨论在原生会话')}${badge('合并由你逐次确认')}${badge('未知状态不重派')}</div></article><div class="metrics"><div class="metric"><div class="label">顶层负责人</div><b>3</b><div class="tiny">2 Codex · 1 Claude Code</div></div><div class="metric"><div class="label">未合并 PR</div><b>${open}</b><div class="tiny">包括两条集成 PR</div></div><div class="metric"><div class="label">可请求合并</div><b>${ready}</b><div class="tiny">不等于已获人工批准</div></div><div class="metric"><div class="label">运行状态未知</div><b>${unknown}</b><div class="tiny">不把未观测当成退出</div></div></div><article class="card"><div class="between"><h2>三个目标，三个责任中心</h2>${B('查看团队 '+I('arrow'),'page','work','ghost sm')}</div>${[40,50,60].map(id=>{const t=task(id),a=ses(t.owner);const texts={40:['单公司从来源到 CSV','来源已经进入集成分支；计算可独立审核，导出由顶层负责人同一会话处理。','现在可用：固定输入交接；整条链路仍需组合验收。'],50:['把当前能力延伸到历史期间','输入包可先独立消费，不把数据依赖变成整条代码分支依赖。','需要你：历史窗口的产品决定；其他无关工作继续。'],60:['提供兼容的来源接口 v2','实现者正处理已核实的兼容问题。CI 成功不替代独立审核结论。','影响：A 的集成 PR 进入 main；不阻止已独立的开发。']};return `<div class="taskbrief"><div class="between"><div class="row">${avatar(a)}<div><b class="small">#${id} · ${texts[id][0]}</b><div class="tiny">${E(a.id)} · ${a.engine}</div></div></div>${status(a.state)}</div><p>${texts[id][1]}</p><div class="between wrap"><span class="tiny">${texts[id][2]}</span>${B('阅读解读','report',id,'sm')}</div></div>`;}).join('')}</article></div><div class="stack"><article class="card"><div class="between"><h2>现在需要你</h2>${badge('动作有范围','amber')}</div><div class="callout"><span class="number">01</span><div><h4>历史范围的决定</h4><p class="small sub" style="margin:5px 0 10px">只影响 PR #151 的相关出口。发现一条决定评论，不会自动解除全部限制。</p>${B('定位原生会话','native','cc-B','sm')}</div></div><div class="callout"><span class="number">02</span><div><h4>${unknown?'核查原执行者是否仍在运行':'执行状态已更新'}</h4><p class="small sub" style="margin:5px 0 10px">cc-51 · 保留原任务与原会话；先核查，再讨论接续。</p>${B('查看执行现场','session','cc-51','sm')}</div></div><div class="callout"><span class="number">03</span><div><h4>计算 PR 的合并目标</h4><p class="small sub" style="margin:5px 0 10px">PR #102 → integration/40，不是直接进入 main。</p>${B('查看条件','pr','102','sm')}</div></div></article><article class="card"><div class="between"><h3>等待关系</h3>${badge('分阶段')}</div><div class="listitem"><b class="small">导出实现 → 计算接口集成</b><p>PR #103 等 #102 进入 integration/40；可先写独立测试。</p></div><div class="listitem"><b class="small">A 进入 main → 来源 v2</b><p>只阻止集成 PR #140 合入 main，不阻止所有子任务。</p></div><div class="listitem"><b class="small">历史抽取 → 输入包验证</b><p>这是数据依赖；无需把 A 的全部代码拉成 B 的基础。</p></div></article><article class="card"><div class="between"><h3>最近实质变化</h3>${B('全部','log','','ghost sm')}</div>${s.events.slice(0,3).map(e=>`<div class="listitem"><b class="small">${E(e.title)}</b><p>${E(e.detail)}</p><span class="tiny">${E(e.at)}</span></div>`).join('')}</article></div></div></div>`;}
function work(){const q=s.query.toLowerCase();const groups=[40,50,60].filter(id=>s.filter==='all'||s.filter===String(id));return heading('TASKS · SESSIONS · BRANCHES','每个 Issue，有明确的负责人和出口。','分配子任务，查看会话；点任一 PR，展开 coding-workflow 和合并条件。',B(I('plus')+'分配 #52','assign','52','primary'))+`<div class="tabs">${[['all','全部任务'],['40','A · 单公司'],['50','B · 历史'],['60','C · 接口']].map(([id,t])=>`<button data-action="filter" data-id="${id}" class="${s.filter===id?'active':''}">${t}</button>`).join('')}<span class="spacer"></span>${B('会话列表','sessions','','ghost sm')}</div><div class="workgrid"><div class="stack">${groups.map(id=>group(id,q)).join('')||'<div class="empty">没有匹配的工作项。</div>'}</div><div class="card"><div class="between"><h2>分支与合并目标</h2>${B('分支规则','branchinfo','','ghost sm')}</div><p class="small sub" style="margin:6px 0 17px">这不是自动选择合并目标：每个 PR 只针对明确的目标检查。</p><div class="branch-main"><b>main</b><span class="tiny" style="color:inherit">保护分支 · 逐次人工确认</span></div>${groups.map(id=>{const target=id===60?'main':'integration/'+id;const ids=Object.values(s.prs).filter(p=>(task(p.issue).parent===id||p.issue===id)&&(!q||('pr '+p.id+' '+task(p.issue).title+' '+p.source+' '+p.target).toLowerCase().includes(q)));return `<div class="branchgroup"><div class="branchlabel">${I('branch')} ${id===60?'C · task/60 → main':E(target)+' · '+(id===40?'A':'B')+' 的集成分支'}</div>${ids.sort((a,b)=>(a.issue===id)-(b.issue===id)||a.id-b.id).map(prRow).join('')||'<p class="tiny">该组无匹配的 PR。</p>'}</div>`;}).join('')}<div class="dependency">${I('info')} 子 PR 合入集成分支 ≠ 子 Issue 自动关闭。主干合并仍需独立满足依赖、检查、审核及人工批准。</div></div></div>`;}
function group(id,q){const t=task(id),a=ses(t.owner),kids=Object.values(s.tasks).filter(t=>t.parent===id);let matching=!q||('#'+id+' '+t.title+' '+a.id+' '+a.engine+' '+kids.map(t=>t.title+' '+t.id).join(' ')).toLowerCase().includes(q);if(!matching)return '';return `<article class="card"><div class="grouptitle"><span class="pillnum">${id===40?'A':id===50?'B':'C'}</span><h3>#${id} ${E(t.title)}</h3><span class="spacer"></span>${engine(a.engine)} ${badge(id===60?'直接对 main':'集成分支')}</div><div class="ownerrow">${avatar(a)}<div class="spacer"><b class="small">${E(a.id)} · 顶层负责人会话</b><div class="tiny">协调${kids.length?'本 Issue 的子任务':'自己的实现与审核交接'} · 无全局主 agent</div></div>${status(a.state)}${B('会话','session',a.id,'sm')}</div>${kids.map(k=>{const ka=k.owner?ses(k.owner):null;const pp=k.pr?pr(k.pr):null;return `<div class="childrow"><span class="branchmark">↳</span><div class="contentcol"><h4>#${k.id} ${E(k.title)}</h4><div class="tiny">${ka?`${E(ka.id)} · ${ka.engine} · ${k.mode==='joined'?'并入负责人，不开第二个进程':'独立工作会话'}`:'尚未分配 · 由你决定使用哪个执行器'}</div><div class="row wrap">${pp?badge(`PR #${pp.id} · ${prLabel(pp)[0]}`,prLabel(pp)[1]):badge('还没有 PR')}${ka?status(ka.state):badge('可分配','amber')}</div></div><div class="row">${ka?B('查看','session',ka.id,'sm'):B('分配','assign',k.id,'soft sm')}${pp?B('PR','pr',pp.id,'ghost sm'):''}</div></div>`;}).join('')}${id===60?`<p class="small sub">没有子 Issue。负责人在原生 Codex 会话中开发，独立审核另开只读上下文。</p>`:''}<div class="groupfoot">${id===40?'#43 并入 cx-A：原生子代理归原生工具管，平台不为每个助手另建工单。':id===50?'#52 可分给新 Claude 会话、新 Codex 会话，或排入 cc-B；状态未知的 #51 不允许重派。':'接口可以先交付文档供其他任务准备；实际合入按代码范围和目标依赖另行核查。'}</div><div class="row wrap" style="margin-top:12px">${B(I('send')+'联系负责人','compose',a.id,'ghost sm')}${B(I('external')+'原生定位','native',a.id,'ghost sm')}${kids.length?B(I('plus')+'分配子任务','assign',kids.find(k=>!k.owner)?.id||kids[0].id,'ghost sm'):''}</div></article>`;}
function delivery(m){return ({pending:['待投递',''],sending:['投递中','amber'],delivered:['已送达','green'],replied:['已回复','green'],unknown:['回执未知','amber'],failed:['失败','red']})[m.status]||[m.status,''];}
function comms(){const ms=s.messages.filter(m=>!s.query||[m.title,m.body,m.from,m.to,String(m.task)].join(' ').toLowerCase().includes(s.query.toLowerCase()));const m=ms.find(x=>x.id===s.selectedMessage)||ms[0];return heading('COMMUNICATION · HANDOFF','消息送到谁，产物用到哪。','子到父、兄弟之间、跨 Issue 都按负责人会话寻址。送达、回复与验证不混为一谈。',B(I('send')+'发送工作消息','compose','','primary'))+`<div class="commsgrid"><div class="msglist">${ms.map(x=>{const d=delivery(x);return `<button class="messageitem ${m?.id===x.id?'active':''}" data-action="selectmsg" data-id="${x.id}"><div class="between"><span class="tiny">${E(x.from)} → ${E(x.to)}</span>${badge(d[0],d[1])}</div><h4>${E(x.title)}</h4><p>#${x.task} · ${E(x.route)}</p><div class="tiny" style="margin-top:6px">${E(x.time)}</div></button>`;}).join('')||'<div class="empty">没有匹配的消息。</div>'}</div><div>${m?messageDetail(m):'<div class="card empty">选择一条工作消息。</div>'}</div></div><div class="card" style="margin-top:19px"><div class="between"><h3>为什么不是另一个聊天室？</h3>${badge('任务协作层')}</div><p class="small sub" style="margin-top:8px">只管理影响协作的请求、交付和通知。需求讨论和编码仍在原生会话里；不广播所有历史，不允许 agent 消息代替 owner 批准。</p></div>`;}
function messageDetail(m){const d=delivery(m),a=m.artifact?s.artifacts[m.artifact]:null;return `<article class="card"><div class="between wrap"><h2>${E(m.title)}</h2>${badge(d[0],d[1])}</div><div class="row wrap small sub" style="margin:12px 0 19px">${E(m.from)} ${I('arrow')} ${E(m.to)} ${badge('#'+m.task)} ${badge(m.route)}</div><p class="msgtext">${E(m.body)}</p>${m.reply?`<div class="notice green" style="margin-top:18px"><b>接收方回复（模拟）</b><br>${E(m.reply)}</div>`:''}${a?`<div class="rule"></div><div class="between"><h3>${E(a.name)}</h3><span class="mono">${E(a.version)}</span></div><div class="stepchain">${[['已登记','提供方声明存在'],['已接收','读取并确认版本'],['已验证','在消费入口核对']].map(([n,t],i)=>`<div class="stepbox ${a.state>=i?'active':''}"><b>${i+1} · ${n}</b><small>${t}</small></div>`).join('')}</div><p class="small sub">${a.evidence?E(a.evidence):'当前没有接收方的行为验证证据。消息送达不自动推进交接状态。'}</p><div class="row wrap" style="margin-top:15px">${B(a.state===0?'模拟接收并核对版本':a.state===1?'模拟消费端验证':'查看交接回执','advance-art',a.id,a.state===2?'':'primary',a.state===0&&!['delivered','replied'].includes(m.status))}</div>`:''}<div class="row wrap" style="margin-top:20px">${['pending','unknown'].includes(m.status)?B(m.status==='unknown'?'核查原投递':'模拟投递到原会话','deliver',m.id,'primary'):''}${m.status==='delivered'?B('模拟接收方回复','reply',m.id,'soft'):''}${B('定位接收会话','native',m.to,'')}${B('再次投递同一事件','redeliver',m.id,'ghost')}</div><details class="source"><summary>版本、观测与投递边界</summary><p>消息 ${E(m.id)} · 接收会话 ${E(ses(m.to)?.native||'未接入')} · 时间 ${E(m.time)}。所有消息和回执均由本页演示逻辑生成。真实运行中由执行器回执证明送达，由接收方产物证明验证。</p></details></article>`;}
function openModal(title,body,foot='',wide=false,kicker='WORKROOM · 离线演示'){previousFocus=document.activeElement;$('#modal-title').textContent=title;$('#modal-kicker').textContent=kicker;$('#modal-body').innerHTML=body;$('#modal-foot').innerHTML=foot||'<span>仅修改本地演示数据，不写入任何外部系统。</span>'+B('关闭','close');$('#modal').classList.toggle('wide',wide);$('#overlay').hidden=false;document.body.style.overflow='hidden';decorate();$('#modal').focus();}
function closeModal(){if($('#overlay').hidden)return;$('#overlay').hidden=true;document.body.style.overflow='';modalState=null;if(previousFocus?.isConnected)previousFocus.focus();}
function prModal(id){const p=pr(id),g=mergeEligibility(p),l=prLabel(p);modalState={type:'pr',id};openModal(`PR #${id} · ${task(p.issue).title}`,`<div class="between wrap"><div class="row wrap"><code>${E(p.source)}</code>${I('arrow')}<code>${E(p.target)}</code>${badge(l[0],l[1])}</div><span class="mono">head ${sh(p.head)}</span></div><div class="workflow">${flow(p).map((f,i)=>`<button class="${f.c}" data-action="stage" data-id="${p.id}:${i}"><b>${i+1}</b>${f.name}</button>`).join('')}</div><div class="notice neutral">流程条是证据导航，不是固定串行机器。组合验收可以先在集成分支执行；报告生成成功不等于审核 PASS。</div><div class="grid2" style="margin-top:17px"><div><h3>工作流前置 · ${g.checks.filter(x=>x.ok).length}/${g.checks.length}</h3><div class="checks">${g.checks.map(c=>`<div class="check ${c.ok?'':'wait'}"><span class="mark">${c.ok?'✓':'○'}</span><div><h4>${c.title}</h4><p>${E(c.text)}</p></div>${badge(c.ok?'满足':'待处理',c.ok?'green':'amber')}</div>`).join('')}</div></div><div class="stack"><div class="card compact"><h3>GitHub 原生状态（模拟）</h3><dl class="kv" style="margin-top:13px"><dt>Draft</dt><dd>${p.draft?'是；不能直接合并':'否'}</dd><dt>冲突</dt><dd>${p.conflict?'存在冲突':'没有观察到冲突'}</dd><dt>平台请求权限</dt><dd>${p.github==='allowed'?'已配置（仅演示）':'尚未确认'}</dd><dt>实际目标</dt><dd><code>${E(p.target)}</code></dd><dt>观测目标 SHA</dt><dd class="mono">${sh(s.branches[p.target])}</dd><dt>受测树</dt><dd class="mono">${sh(p.ciTree)} · head/base 单独绑定</dd><dt>是否合并</dt><dd>${p.merged?'已读回模拟合并结果':'没有合并'}</dd></dl><div class="source">平台工作流条件和 GitHub 仓库规则分别核查。最终请求带你确认的 head；不能将 mergeable 单个字段当作所有条件。</div></div><div class="card compact"><h3>证据与原生入口</h3><div class="row wrap" style="margin-top:12px">${B('打开负责人','native',task(p.issue).owner,'sm')}${B('角色 prompt','prompt',p.id,'sm')}${B('技术解读','report',p.issue,'sm')}</div><p class="tiny" style="margin-top:10px">阶段记录由对应执行任务产生；按钮只注入演示结果，不实际运行测试或模型。</p></div>${p.id===151?`<div class="notice">D1 在 cc-B 原生会话讨论。决定文字、owner 确认和本版本实施证据是三件事。${B('处理定位','native','cc-B','sm')}</div>`:''}${p.history.length?`<details class="source"><summary>查看旧版本记录（${p.history.length}）</summary>${p.history.map(h=>`<p>${E(h.verdict)} @${sh(h.head)} · 历史保留，不自动用于当前版本</p>`).join('')}</details>`:''}</div></div><div class="testbar">${!p.merged?B('模拟新 head','newhead',p.id,'sm'):''}${!p.merged?B('模拟 CI 回执','ci',p.id,'sm'):''}${!p.merged?B('正式审核（模拟）','review',p.id,'sm'):''}${[140,150].includes(p.id)?B('组合验收（模拟）','accept',p.id,'sm'):''}${p.id===151&&s.decisions.D1.confirmed&&!s.decisions.D1.applied?B('核对决定实施证据','apply-decision',p.id,'sm'):''}${p.merged?B('生成解读（模拟）','explain',p.id,'sm'):''}</div>`,`<span>本页所有写动作都是本地演练。</span><div class="row">${p.merged?badge('已合入 '+p.target,'green'):p.draft?B('明确标记 Ready（模拟）','ready',p.id,'primary'):B('检查并请求合并','merge',p.id,'primary',!g.ready)}</div>`,true,'PR WORKFLOW · 版本与动作分别核对');}
function stageModal(value){const [id,i]=value.split(':').map(Number),p=pr(id),f=flow(p)[i];modalState={type:'stage',id};openModal(`${i+1} · ${f.name}`,`<div class="notice neutral">PR #${id} · head ${sh(p.head)} · 目标 ${E(p.target)}</div><p style="margin-top:16px">${E(f.detail)}</p><div class="rule"></div><p class="small sub">生产接入：使用 coding-workflow 已批准版本的对应提示。需要执行时在原生引擎运行，平台记录实际 job、版本和结果；不让这个页面自证真实验收。</p>`,`<span>阶段可并行或前置；不强制每格一个 agent。</span>${B('返回 PR','pr',id)}`);}
function sessionModal(id){const a=ses(id);modalState={type:'session',id};const active=['running','starting','pause_requested','probing'].includes(a.state);openModal(`${a.id} · ${a.role}`,`<div class="row">${avatar(a)}<div><h3>${a.engine}</h3><span class="tiny">${a.tasks.map(i=>'#'+i).join('、')||'尚未承担子任务写入'} · ${a.role}</span></div><span class="spacer"></span>${status(a.state)}</div><div class="rule"></div><dl class="kv"><dt>原生会话</dt><dd class="mono">${E(a.native)}（示例）</dd><dt>执行尝试</dt><dd>attempt-${a.id}-${a.attempt}</dd><dt>所在机器</dt><dd>demo-local-runner</dd><dt>工作区</dt><dd class="mono">${E(a.workspace)}</dd><dt>最近事件</dt><dd>${E(a.event)}</dd><dt>接入能力</dt><dd>${a.cap==='control'?'定位／观察／控制均为模拟':'观察能力示例；写入控制不可用'}</dd><dt>执行用量</dt><dd>${a.usage===null?'未接入':fmt(a.usage)+' tokens（示例）'}；费用不估算</dd></dl><div class="notice neutral" style="margin-top:18px">${a.state==='unknown'?'未知不等于退出。不能重派或杀进程；先核查原执行器。':a.tasks.length>1?'同一会话关联多个工作项，只计一个实际执行者；后续任务加入待办，不启动第二条写进程。':'会话本轮完成，不等于 Issue 已完成。原生子代理仍由原生工具管理。'}</div><details class="source"><summary>原生子代理与控制边界</summary><p>此模板没有读取真实子代理事件，内部拓扑显示为“由原生工具内部管理”。真实适配支持时才展开。一个 session 不能同时被平台和另一个 CLI 控制端并发驱动写入。</p></details><div class="testbar">${a.state!=='unknown'&&a.state!=='terminated'?B('模拟连接丢失','disconnect',id,'sm'):''}${B('查看准确定位','native',id,'sm')}${B('发送工作消息','compose',id,'sm',a.cap!=='control')}</div>`,`<span>没有启动真实进程。所有状态都是演示。</span><div class="row">${a.state==='unknown'?B('核查原执行者','probe',id,'primary'):a.state==='terminated'||a.state==='paused'?B('接续原任务（模拟）','resume',id,'primary',a.cap!=='control'):active?B('请求暂停（模拟）','pause',id,'',a.cap!=='control'):B('在原生会话处理','native',id,'primary')}</div>`);}

function dispatchTask(id,mode){const t=task(id);if(t.owner){const i=intent('派发拒绝','#'+id);finish(i,`#${id} 已由 ${t.owner} 承担，状态 ${ses(t.owner).state}；没有启动第二个写入者。`,'failed');toast('已拒绝重复派发；原任务与原会话保持。');closeModal();render();return false;}const parent=task(t.parent),pa=ses(parent.owner);if(mode==='joined'&&['unknown','terminated'].includes(pa.state)){toast('负责人状态未知或已退出，先核查，不能假定可接收新工作。');return false;}const en=mode==='other'?(pa.engine==='Codex'?'Claude Code':'Codex'):pa.engine;const idn=mode==='joined'?pa.id:(en==='Codex'?'cx-':'cc-')+id+'-'+(++s.seq);const i=intent('派发子任务','#'+id);t.owner=idn;t.mode=mode==='joined'?'joined':'separate';if(mode==='joined'){if(!pa.tasks.includes(id))pa.tasks.push(id);pa.event=['running','starting'].includes(pa.state)?`#${id} 已排入负责人待办，不启动第二轮写入`:`接收到 #${id} 的实施范围，等待原生轮次开始`;}else{s.sessions[idn]={id:idn,engine:en,parent:t.parent,role:t.title+'负责人',state:'starting',tasks:[id],workspace:'/demo/'+id,native:'demo-'+en.toLowerCase().replace(' ','-')+'-'+id+'-'+s.seq,event:'正在等待创建会话回执',cap:'control',attempt:1,usage:0};}i.state='sent';log('子任务派发已登记',`#${id} → ${idn}；${mode==='joined'?'复用现有会话':'独立工作区'}。`);closeModal();s.page='work';render();later(()=>{const a=ses(idn);if(mode!=='joined'){a.state='running';a.event='原生会话与轮次已开始（模拟）';}finish(i,mode==='joined'?`原负责人 ${idn} 已收到待办；没有第二个进程。`:`已收到 session ${a.native} 与工作区回执；这不等于任务完成。`);toast('派发已获模拟回执。再次分配同一工作项会被拒绝。');},1100);return true;}
function nativeModal(id){const a=ses(id);modalState={type:'native',id};const cmd=a.engine==='Codex'?'codex resume <实际会话ID>':'claude --resume <实际会话ID>';openModal(`回到 ${a.engine} · ${id}`,`<div class="notice">当前是离线模板，没有真实会话链接。不会打开替代会话，也不会执行下方命令。</div><div class="rule"></div><dl class="kv"><dt>关联责任</dt><dd>${E(a.role)} · 顶层 #${a.parent}</dd><dt>原生 ID</dt><dd class="mono">${E(a.native)}（虚构）</dd><dt>工作区</dt><dd class="mono">${E(a.workspace)}</dd><dt>需要处理</dt><dd>${id==='cc-B'?'确认历史窗口范围，并把结论与作用域写回正式 Issue。':'继续原任务或讨论关联问题；范围与权限不因平台消息自动扩大。'}</dd></dl><p class="small sub" style="margin:15px 0 7px">真实接入优先使用官方打开方式；命令模板需替换准确 ID，并避免两个控制端同时驱动写入。</p><div class="codebox">${E(cmd)}</div>${id==='cc-B'?`<div class="rule"></div><h3>演示：决定写回不等于自动放行</h3><p class="small sub" style="margin:8px 0">先读取记录，再核对 owner 来源；落实到代码或审核条件后，才处理对应合并前置。</p><div class="row wrap">${B('模拟发现决定评论','decision-record','','sm')}${B('模拟核对 owner 确认','decision-confirm','','sm',!s.decisions.D1.record)}</div><p class="tiny" style="margin-top:8px">当前：${!s.decisions.D1.record?'尚无记录':!s.decisions.D1.confirmed?'有文字，来源未确认':!s.decisions.D1.applied?'已确认，实施条件待核对':'决定与本版本实施证据均已核对'}</p>`:''}`,`<span>讨论和决定留在原生工具；平台不让你重复确认同一产品取舍。</span>${B('返回','close')}`);}
function compose(target){const ids=Object.keys(s.sessions).filter(id=>ses(id).cap==='control');const to=target&&ids.includes(target)?target:'cc-B';modalState={type:'compose'};openModal('发送关联任务的工作消息',`<div class="notice neutral">这是任务通信，不是重建聊天客户端。消息不会增加权限或默认改变 Issue 契约。</div><div class="grid2" style="margin-top:16px"><label class="field"><span>发送方</span><select id="msg-from">${ids.map(id=>`<option value="${id}" ${id==='cx-A'?'selected':''}>${id} · ${ses(id).engine}</option>`).join('')}</select></label><label class="field"><span>接收方 · 具体会话</span><select id="msg-to">${ids.map(id=>`<option value="${id}" ${id===to?'selected':''}>${id} · ${ses(id).engine} · ${statusState(ses(id).state)[0]}</option>`).join('')}</select></label></div><label class="field"><span>关联工作项</span><select id="msg-task">${Object.values(s.tasks).map(t=>`<option value="${t.id}" ${t.id===50?'selected':''}>#${t.id} ${E(t.title)}</option>`).join('')}</select></label><label class="field"><span>标题</span><input id="msg-title" maxlength="100" value="请核对这次交付的固定接口"></label><label class="field"><span>需要对方做什么</span><textarea id="msg-body" maxlength="3000">请读取交付接口与相应证据，确认你方的消费位置。若有不兼容，请回复具体版本和最小复现；不重做已验证内容，权限范围不变。</textarea></label>`,`<span>状态未知的接收端保留待核查，不新建替身。</span>${B('登记并模拟投递','send','','primary')}`);}
function send(){const from=$('#msg-from').value,to=$('#msg-to').value,tid=+$('#msg-task').value,title=$('#msg-title').value.trim(),body=$('#msg-body').value.trim();if(from===to){toast('请选择不同的发送方与接收方。');return;}if(!title||!body){toast('请填写标题与需要处理的内容。');return;}const m={id:'demo-m-'+(++s.seq),from,to,task:tid,title,body,type:'request',status:'pending',route:ses(from).engine===ses(to).engine?'同工具 · 原生通道':'跨工具 · 平台适配',time:stamp()};s.messages.unshift(m);s.selectedMessage=m.id;s.page='comms';closeModal();deliver(m.id);render();}
function deliver(id){const m=s.messages.find(m=>m.id===id);if(!m)return;if(m.status==='unknown'){openModal('先核查原消息，不直接再次投递',`<p>消息 ${E(id)} 的送达结果未知。真实实现先查询原会话或请求 ID；无法确认时保留未知，不自动重发。</p><div class="notice neutral" style="margin-top:15px">下方仅注入“原投递已经送达”的演示证据，不发送第二份消息。</div>`,`${B('保留未知','close')}${B('模拟查到原回执','delivery-confirm',id,'primary')}`);return;}if(m.status!=='pending'){const it=intent('消息去重',id);finish(it,'相同消息 ID 已经登记；没有再次投递。','failed');toast('重复事件已拦截，不新建会话。');return;}if(ses(m.to)?.state==='unknown'){toast('接收方状态未知：保留待投递，先核查原会话。');log('消息暂未投递',`${m.id} → ${m.to}，原会话不可确认。`);return;}m.status='sending';const it=intent('发送消息',m.id);it.state='sent';log('消息请求已发送',`${m.from} → ${m.to} · ${m.route}`);render();later(()=>{if(ses(m.to)?.state==='unknown'){m.status='unknown';finish(it,'投递期间连接中断：送达状态未知，不自动重试。','unknown');}else{m.status='delivered';finish(it,`适配器已确认 ${m.id} 投递至 ${ses(m.to).native}；不代表任务完成。`);}toast('消息状态已更新；交付物验证仍是独立步骤。');},1000);}
function advanceArt(id){if(s.intents.some(i=>i.target===id&&['pending','sent','unknown'].includes(i.state))){toast('该交接已有未确认动作，请核查原记录，不重复执行。');return;}const a=s.artifacts[id],m=s.messages.find(x=>x.artifact===id);if(a.state===2){toast('该版本交接已验证。再次读取不会新增验证信用。');return;}if(a.state===0&&!['delivered','replied'].includes(m.status)){toast('先取得实际消息送达回执。');return;}const it=intent(a.state===0?'接收交付物':'验证交付物',id);it.state='sent';const next=a.state+1;log('交接检查已请求',`${a.name} · ${a.version}`);later(()=>{a.state=next;a.evidence=next===1?'接收方确认读取到匹配版本；行为尚未验证（模拟）':'接收方在固定输入的消费入口执行验证并通过（模拟）';finish(it,a.evidence);if(next===2){m.status='replied';m.reply='输入包已在历史消费入口验证；本次只建立数据依赖，不改变代码基线。';}toast(next===1?'已接收，不等于已验证。':'交接已验证；没有自动合并任何 PR。');},950);}
function mergeModal(id){if(s.intents.some(i=>i.kind==='人工合并请求'&&i.target==='PR #'+id&&['pending','sent','unknown'].includes(i.state))){toast('该 PR 已有未确认合并请求，先核查原请求，不重复发送。');return;}const p=pr(id),g=mergeEligibility(p);if(!g.ready){toast('合并前置或 GitHub 状态不满足，不能绕过。');prModal(id);return;}modalState={type:'merge',id,head:p.head,base:s.branches[p.target],target:p.target};openModal(`确认请求：PR #${id} → ${p.target}`,`<div class="notice">这是模拟操作，不会请求 GitHub。真实产品中，每次合并都由人确认，并读取实际回执。</div><dl class="kv" style="margin-top:18px"><dt>源分支</dt><dd class="mono">${E(p.source)}</dd><dt>明确目标</dt><dd><b>${E(p.target)}</b></dd><dt>你确认的 head</dt><dd class="mono">${E(p.head)}</dd><dt>观测 base</dt><dd class="mono">${E(s.branches[p.target])}</dd><dt>方法</dt><dd>merge commit（演示默认；真实使用仓库允许的方法）</dd><dt>影响</dt><dd>更新目标分支；不是生产发布，也不自动关闭子 Issue。</dd></dl><label class="radiochoice" style="margin-top:18px"><input type="checkbox" id="merge-confirm"><span>我确认这个候选和目标，只执行本地模拟。<small>请求返回前不显示“已合并”；head 变化时拒绝旧确认。</small></span></label><div class="row wrap">${B('故障演练：确认后 head 改变','merge-race',id,'ghost sm')}</div>`,`<span>请求携带确认 head，不使用“最新提交”模糊代替。</span>${B('发送模拟合并请求','merge-submit',id,'primary')}`);}
function mutate(p,baseUpdate=false){if(p.review)p.history.unshift({...p.review});p.head=SHA('d'+p.id.toString(16)+(++s.seq).toString(16));p.ci='pending';p.ciHead=null;p.ciBase=null;if(baseUpdate)p.base=s.branches[p.target];if(p.source.startsWith('integration/'))s.branches[p.source]=p.head;log('模拟新提交出现',`PR #${p.id} head → ${sh(p.head)}。旧审核保留，但不能自动放行新版本。`);save();}
function submitMerge(id){const pending=modalState&&modalState.type==='merge'?{...modalState}:null;if(!pending||pending.id!==id)return;if(!$('#merge-confirm').checked){toast('请先确认你看到的候选与目标。');return;}const p=pr(id),it=intent('人工合并请求','PR #'+id);it.head=pending.head;it.targetBranch=pending.target;it.state='sent';closeModal();toast('请求已发送，等待模拟 GitHub 回执。');render();later(()=>{const current=pr(id);if(current.head!==pending.head||current.target!==pending.target||s.branches[pending.target]!==pending.base){finish(it,'拒绝：head、目标或 base 已改变。旧确认未被应用；请重新核查。','failed');toast('请求被拒绝：确认的候选已改变，没有合并。');return;}if(!mergeEligibility(current).ready){finish(it,'拒绝：请求前置已经变化，未绕过仓库规则。','failed');return;}current.merged=true;current.draft=false;current.mergeSHA=SHA('e'+id.toString(16)+(++s.seq).toString(16));s.branches[current.target]=current.mergeSHA;const parent=Object.values(s.prs).find(p=>p.source===current.target&&!p.merged);if(parent){if(parent.review)parent.history.unshift({...parent.review});parent.head=current.mergeSHA;parent.ci='pending';parent.ciHead=null;parent.ciBase=null;}finish(it,`GitHub 模拟回执：PR #${id} 合入 ${current.target}@${sh(current.mergeSHA)}。子 Issue 未自动关闭。`);toast('模拟合并已确认。兄弟 PR 的 base 条件按新目标重新核对。');},1300);}
function ready(id){const p=pr(id);openModal('Draft → Ready 是一个独立动作',`<p>PR #${id} 将允许进入正式审核与合并准备，但不因此获得 PASS，也不直接合并。</p><div class="notice neutral" style="margin-top:14px">演示目标 ${E(p.target)} · 当前 head ${sh(p.head)}</div>`,`${B('取消','close')}${B('确认模拟标记 Ready','ready-confirm',id,'primary')}`);}
function reviewModal(id){const p=pr(id);modalState={type:'review',id,head:p.head};openModal(`独立审核 · PR #${id}`,`<div class="notice neutral">这是结果注入演练，不是真的模型审核。独立会话读取契约、固定 diff 与原始证据，不继承作者对话。</div><dl class="kv" style="margin:16px 0"><dt>固定 head</dt><dd class="mono">${p.head}</dd><dt>目标</dt><dd>${E(p.target)}</dd><dt>已报告返工</dt><dd>${p.rounds} 轮；重复查询和传输重试不算新轮次。</dd></dl><label class="field"><span>注入演示结论</span><select id="review-verdict"><option>PASS</option><option>REWORK_REQUIRED</option><option>OWNER_DECISION_REQUIRED</option></select></label><p class="small sub">代码可审与合并新鲜度分开。此处不会自动更新 base、清除待决事项或把 Draft 改为 Ready。</p>`,`<span>结论只绑定本次固定 head。</span>${B('启动模拟审核','review-start',id,'primary')}`);}
function runReview(id){const p=pr(id),hd=modalState.head,verdict=$('#review-verdict').value;const key=`review-${id}-${hd}`;if(s.jobs.some(j=>j.key===key&&['running','unknown'].includes(j.state))){toast('相同版本已有未结束或未知的审核 job；不重复启动。');return;}const job={id:'demo-j-'+(++s.seq),key,type:'review',head:hd,pr:id,state:'running'};s.jobs.push(job);const it=intent('独立审核任务',job.id);it.state='sent';closeModal();log('模拟审核启动',`${job.id} · PR #${id} @${sh(hd)}`);render();later(()=>{job.state='completed';job.result=verdict;if(p.head===hd){if(p.review)p.history.unshift({...p.review});p.review={verdict,head:hd,who:job.id,at:stamp()};if(verdict==='REWORK_REQUIRED'){p.rounds+=1;p.threads=Math.max(1,p.threads);}else if(verdict==='PASS'){p.threads=0;}}else{p.history.unshift({verdict,head:hd,who:job.id,at:stamp()});}finish(it,`${verdict} @${sh(hd)}${p.head===hd?'':'；当前 head 已变化，结果只归档旧版本'}。不是实际审核证明。`);toast('模拟审核回执已归档；合并没有发生。');},1250);}
function ciModal(id){const p=pr(id);modalState={type:'ci',id,head:p.head,base:s.branches[p.target]};openModal('读取 CI：工作流成功不是万能 PASS',`<p>注入的 CI 将对应 PR #${id} head ${sh(p.head)} 与目标 ${sh(s.branches[p.target])} 的测试合并树。旧检查仍保留其原范围。</p><label class="field" style="margin-top:17px"><span>模拟回执</span><select id="ci-result"><option value="success">必要检查全部成功</option><option value="failure">一项必要检查失败</option></select></label><div class="notice neutral">不自动修改分支。base 落后时，应由原生负责人更新；“代码可审”不受此处阻止。</div><div class="row" style="margin-top:12px">${B('模拟负责人已更新 base','update-base',id,'sm')}</div>`,`<span>记录受测树、head 与 base，不混用身份。</span>${B('注入模拟回执','ci-confirm',id,'primary')}`);}
function acceptModal(id){const p=pr(id);modalState={type:'accept',id,head:p.head};openModal('父任务组合验收 · 固定集成分支',`<div class="notice neutral">不是等所有子任务进入 main 才第一次检验。验收绑定 ${E(p.source)}@${sh(p.head)}；结果存在不自动批准合并。</div><label class="field" style="margin-top:17px"><span>注入演示验收结果</span><select id="accept-result"><option value="accept">accept · 该候选用户场景通过</option><option value="reject">reject · 组合行为不满足目标</option><option value="request_evidence">request_evidence · 需要补充证据</option></select></label><p class="small sub">真实环境沿用项目既有的用户验收标准；实验性 acceptance-agent 只提供建议，不能自动升级成唯一合并门。</p>`,`<span>集成分支之后变化，要核对受影响范围。</span>${B('登记演示验收结果','accept-confirm',id,'primary')}`);}
function probeModal(id){const a=ses(id);modalState={type:'probe',id};openModal('核查原会话：未知不是已退出',`<p>原会话 <code>${E(a.native)}</code> 的最近事件是“${E(a.event)}”。下一步应该查询原执行器与远端，而不是新开会话。</p><label class="field" style="margin-top:18px"><span>选择本次模拟核查能观察到的结果</span><select id="probe-result"><option value="unknown">仍不可确认 · 保留未知</option><option value="running">原会话仍在执行</option><option value="waiting">原会话正在等待原生批准</option><option value="terminated">原执行已确认退出</option></select></label><div class="notice">这些选项是故障演练注入，不代表对真实执行器的检测结果。</div>`,`<span>不杀进程，不重新派发。</span>${B('模拟核查回执','probe-confirm',id,'primary')}`);}
function promptModal(id){const p=pr(id);openModal('复用 coding-workflow，不重建 prompt 平台',`<div class="notice neutral">以下是展示参数填充的简化模板，不冒称仓库提示原文。实际实现从一个经批准的 coding-workflow 版本读取对应角色提示。</div><label class="field" style="margin-top:16px"><span>阶段</span><select id="prompt-role"><option value="review">独立正式审核</option><option value="verify">Finding 核实</option><option value="explain">Tech Lead 解读</option><option value="accept">用户视角验收</option></select></label><pre id="prompt-text" class="codebox">${E(promptText('review',p))}</pre><div class="source">填入：Issue #${p.issue}、PR #${p.id}、完整 head ${p.head}、目标 ${p.target}、适用契约与权限。原流程第 12 步保持暂停，不恢复为额外门。</div>`,`<span>独立审核不继承实现对话；修复移交写入权后再做。</span>${B('复制模板','copy-prompt',id,'primary')}`);$('#prompt-role').addEventListener('change',()=>$('#prompt-text').textContent=promptText($('#prompt-role').value,p));}
function promptText(role,p){const head=`项目：example/data-pipeline（演示）\nIssue #${p.issue}；PR #${p.id}\n受审/解释 head：${p.head}\n目标分支：${p.target}\n\n`;const prompts={review:'按已批准的正式审核提示，检查当前固定版本。\n核对用户目标、真实缺陷和不必要复杂度；重要猜想先通过最小复现验证。\n输出 PASS / REWORK_REQUIRED / OWNER_DECISION_REQUIRED 并附依据。\n默认只读，不写实现者工作区，不合并。',verify:'读取本轮已提出的 findings，先确认是否真实存在。\n区分事实、触发路径、影响面、必要修复和可复用测试。\n证据不足明确标注；不要将未验证猜想变成新开发范围。',explain:'基于固定源码与记录，解释改动前后、用户如何使用、关键机制与取舍。\n说明什么经过实际验证、什么只是执行者报告。\n面向未读底层代码的程序员，不以函数清单代替解释。',accept:'从用户角度定义并执行必要的验收场景。\n读取契约、产物与原始证据，不继承作者实现叙述。\n验收绑定固定候选；请求更多证据不自动意味着全面重做。'};return head+prompts[role];}
function report(id){const t=task(id);openModal(`#${id} · 技术解读与交付说明`,`<div class="notice">示例报告，为说明平台的人类信息面编写。没有在本页执行真实代码、测试、SEC 请求或模型调用。</div><div class="report"><h3>这项工作为什么值得做？</h3><p>${[40,41,42,43].includes(id)?'目标不是多一套命令，而是让用户选择公司后取得可解释的 CSV，同时让来源和计算仍可独立运行。':id===50||id===51||id===52?'历史能力不只是更换年份：需要把期间选择、来源依赖和实际测量窗口一起说明。':'来源接口的稳定交接能够减少消费者猜测，但接口文档可用不等于代码已经进入主干。'}</p><div class="flowline"><span>用户目标</span>→<span>明确任务边界</span>→<span>原生会话实施</span>→<span>固定产物</span>→<span>独立验证</span>→<span>人工合并</span></div><h3>现在推进到哪一步？</h3><p>从任务详情和 PR 流程查看当前候选。这个说明不根据一条“已完成”的消息推断业务成功；数据、接口、代码合并和用户验收分别展示。</p><h3>如何工作，失败时会怎样？</h3><p>负责人维护自己的任务与工作区。跨任务只交接必要版本；接收端先读取，再验证。平台断开时保留会话对应，不以重新派发覆盖未知状态；合并请求失败时保留失败原因，不显示为已合并。</p><h3>哪些取舍保留给你？</h3><p>需求范围、成本和失败语义默认回到原生会话处理。平台提供定位，随后读取可信决定和实施证据；不会让一句格式正确的评论自动变成授权。</p><h3>阅读边界</h3><p>真实版由原生执行器按 coding-workflow 生成报告，本平台只聚合呈现。报告应绑定实际源码、测试范围、生成时间与限制；作者报告和独立验证分别标注。</p></div>`,`<span>原生生成，平台呈现。不重复开发解读模型。</span>${B('定位负责人','native',t.owner||task(t.parent).owner)}`,true,'HUMAN VIEW · 为什么、怎样做、凭什么');}
function capabilities(){openModal('接入能力：只承诺已经验证的部分',`<div class="notice">当前全部是演示状态。没有验证你的账号、本机版本、会话可见性、认证或额度。本页不提供真实连接配置。</div><div class="scroll" style="margin-top:15px"><table class="datatbl"><thead><tr><th>能力</th><th>Codex</th><th>Claude Code</th><th>真实版规则</th></tr></thead><tbody>${[['准确定位会话','必需'],['创建或续接特定会话','必需'],['发送两轮输入并读取结果','必需'],['运行事件和状态查询','必需'],['中断与暂停语义','可选'],['用量、原生深链接','有则复用']].map(([n,r])=>`<tr><td>${n}</td><td>待实际验证</td><td>待实际验证</td><td>${r}</td></tr>`).join('')}</tbody></table></div><div class="report"><h3>三级接入</h3><p>已关联：能够准确定位；可观察：能取得运行事件；可控制：对应操作已经验证，才开放按钮。某项能力不可用，不阻塞独立的只读功能。</p><h3>能力优先复用</h3><p>原生正式接口、原生子代理和已验证的委派插件优先。不抓网页隐藏接口，不模拟终端按键，不将新建 SDK 会话冒充正在打开的原会话。</p></div>`,null,true);}
function workflow(){openModal('抽象工作流：三个责任中心，一层协作',`<div class="notice green">这是一份文字化运行结构，不是仪表盘截图。平台承担转交与核对，模型负责局部问题，人掌握范围和合并。</div><div class="abstract" style="margin:20px 0"><div class="stage"><b>你 · Owner</b>确定目标与权限<br>原生讨论产品取舍<br>逐次确认合并</div><span class="arrow">→</span><div class="stage mainstage"><b>协作层 · 普通程序</b>读取 GitHub 工作项<br>分配 / 精确寻址 / 投递去重<br>核对运行与交付 / 汇总给人</div><span class="arrow">↔</span><div class="stage"><b>各顶层负责人</b>A：Codex · 子任务 A1/A2<br>B：Claude Code · 子任务 B1/B2<br>C：Codex · 无子任务</div></div><div class="flowline"><span>已批准 Issue</span>→<span>唯一写入执行</span>→<span>固定 PR / 产物</span>→<span>新会话正式审核</span>→<span>核实与修复</span>→<span>人工请求合并</span>→<span>技术解读与用户验收</span></div><p class="small sub">各负责人与子任务允许直接通信；跨工具走适配，消息带工作项和版本。独立审查不继承作者对话。父级组合验收在集成分支上提前执行，不等所有代码进入 main。</p><div class="grid2" style="margin-top:18px"><div class="card compact"><h3>GitHub 管工作事实</h3><p class="small sub" style="margin-top:7px">Issue 与关系、分支、PR、CI、审查、批准来源。平台可以缓存，不另造一份可独立编辑的需求。</p></div><div class="card compact"><h3>执行器管运行事实</h3><p class="small sub" style="margin-top:7px">原生会话、轮次、工具运行、等待和退出。GitHub 没有新提交，不等于 agent 没在工作。</p></div></div><div class="report"><h3>coding-workflow 接管范围</h3><p>第 1–6 步的需求、FSD、Bridge、Issue 与必要读回保留原生讨论和判断；第 7–10 步的派发、版本传递和审核循环由平台衔接。第 11 步技术解读与第 13 步用户验收复用已有方法，第 12 步仍暂停。</p><h3>首版不做</h3><p>全局主 agent、统一聊天、终端、文件编辑器、通用审批引擎、自动 rebase、自动合并、状态未知时抢占接管、多仓库多用户，以及逐句话的证据台账。</p></div>`,null,true,'WORKFLOW · 边界与接管');}
function branchInfo(){openModal('分支是交付拓扑，不是任务锁',`<div class="codebox">main\n├─ integration/40  ← task/40-41、task/40-42、task/40-43\n├─ integration/50  ← task/50-51、task/50-52\n└─ task/60         → 直接针对 main</div><div class="report"><h3>为什么不用 feat/40 与 feat/40/42？</h3><p>采用不互为路径前缀的命名，避免同一 Git 引用命名空间冲突。关系由 GitHub 工作项与显式映射表示，不靠分支名推断任务所有权。</p><h3>代码、接口和数据分开</h3><p>可以消费一个尚未合并的固定接口，不意味着可以安全将所有相关代码带入目标。真正请求合并前检查 source 与 target 的完整差异和祖先提交；平台不自动搬运或重排提交。</p><h3>不把 “mergeable” 当所有规则</h3><p>工作流前置与 GitHub 原生状态分别展示。Draft、冲突、权限、必需检查都可能阻止请求；head/base 变更后重新核查。</p><h3>子 Issue 的关闭</h3><p>模板将“代码已合入集成分支”与“Issue 已按验收政策关闭”分开。无需额外建立自动关闭器。</p></div>`,null,false);}
function guide(){openModal('按这四个场景体验，无需读全部页面',`<div class="stack">${[['分配一个子任务','把 #52 分给同工具、另一工具或负责人会话，再试一次验证去重。','assign','52'],['跨工具交接','从 m3 开始：送达 → 接收输入包 → 验证。不要把任何一步当成全部完成。','guide-comms','m3'],['请求合入正确目标','查看 PR #102 的流程与条件，确认合入 integration/40；也可模拟确认后 head 改变。','pr','102'],['未知状态与原生决定','核查 cc-51，或者定位 cc-B，体验决定记录不会自动放行合并。','session','cc-51']].map(([t,p,a,id],i)=>`<div class="card compact"><div class="row"><span class="pillnum">${i+1}</span><h3>${t}</h3></div><p class="small sub" style="margin:8px 0 12px">${p}</p>${B('开始演示 '+I('arrow'),a,id,'soft')}</div>`).join('')}</div>`,`<span>可以随时重置本页。没有真实外部写操作。</span>${B('重置演示','reset')}`,false);}
function logModal(){openModal('动作与回执：提出不等于已发生',`<div class="notice neutral">以下全部由本地演示产生。页面刷新时未确认动作会保留为未知，不自动补发。</div><div class="logpanel" style="margin-top:15px">${s.intents.length?s.intents.map(i=>`<div class="listitem"><div class="between"><b class="small">${E(i.kind)} · ${E(i.target)}</b>${badge(({pending:'已提出',sent:'已发送',confirmed:'已确认',failed:'已拒绝',unknown:'未知'})[i.state],i.state==='confirmed'?'green':i.state==='failed'?'red':'amber')}</div><p>${E(i.receipt||'尚未取得回执')}</p><span class="tiny">${E(i.id)} · ${E(i.at)}</span></div>`).join(''):'<div class="empty">尚未产生动作，去分配任务、发消息或检查 PR。</div>'}</div><h3 style="margin:20px 0 8px">项目事件</h3><div class="events">${s.events.slice(0,12).map(e=>`<div class="event"><b>${E(e.title)}</b><div class="small sub">${E(e.detail)}</div><span class="tiny">${E(e.at)}</span></div>`).join('')}</div>`,`<span>仅保存在本浏览器；不冒充生产级事务保证。</span><div class="row">${B('导出状态','export')}${B('重置','reset')}</div>`,true);}
function doPause(id){const a=ses(id);if(!['running'].includes(a.state)){toast('当前不适合请求暂停，先核查原生状态。');return;}const i=intent('暂停请求',id);i.state='sent';a.state='pause_requested';a.event='已请求在安全边界暂停，尚未确认';closeModal();render();later(()=>{if(a.state==='unknown'){finish(i,'暂停是否生效未知，不据此接管任务。','unknown');return;}a.state='paused';a.event='模拟执行器确认本轮已停止推进；尚未终止会话';finish(i,'执行器确认暂停；没有把请求发送当作暂停事实。');toast('模拟暂停已确认。');},1050);}
function doResume(id){const a=ses(id);if(!['terminated','paused'].includes(a.state)){toast('未确认停止，禁止接续或再次派发。');return;}const i=intent('接续原任务',id);i.state='sent';a.state='starting';a.attempt+=1;a.event='按原生会话标识请求接续；范围未扩大';closeModal();render();later(()=>{a.state='running';a.event='原任务接续获确认（模拟），未新建竞争负责人';finish(i,`${id} attempt ${a.attempt} 已确认开始；只有一个写入执行。`);},1000);}

case 'guide-comms':closeModal();s.page='comms';s.selectedMessage=id;render();break;
case 'deliver':deliver(id);render();break;
case 'delivery-confirm':{const m=s.messages.find(x=>x.id===id);m.status='delivered';log('查到原消息送达记录',`${id} 没有被再次发送（模拟）。`);closeModal();render();break;}
case 'redeliver':{const m=s.messages.find(x=>x.id===id);if(m.status==='pending'){deliver(id);}else if(m.status==='unknown'){deliver(id);}else{const i=intent('重复投递拒绝',id);finish(i,'相同消息已登记，不新建会话、不再次投递。','failed');toast('重复事件被忽略，原记录保留。');}render();break;}
case 'reply':{const m=s.messages.find(x=>x.id===id);m.status='replied';m.reply='已读取你的请求。下一步会在本任务范围内核对固定接口，并返回具体证据；这不是新增权限。';log('接收方回复（模拟）',id);render();break;}
case 'advance-art':advanceArt(id);render();break;
case 'merge':mergeModal(+id);break;
case 'merge-race':{const p=pr(+id);mutate(p);toast('故障已注入：远端 head 已改变。现在确认旧候选，请求应被拒绝。');render();break;}
case 'merge-submit':submitMerge(+id);break;
case 'ready':ready(+id);break;
case 'ready-confirm':{const p=pr(+id),i=intent('标记 Ready','PR #'+id);i.state='sent';closeModal();later(()=>{p.draft=false;finish(i,'Draft 标志已解除（模拟）；没有生成审核 PASS，也没有合并。');toast('已模拟标记 Ready。');},800);break;}
case 'newhead':{mutate(pr(+id));render();prModal(+id);break;}
case 'review':reviewModal(+id);break;
case 'review-start':runReview(+id);break;
case 'ci':ciModal(+id);break;
case 'ci-confirm':{const p=pr(+id),result=$('#ci-result').value,hd=modalState.head,bs=modalState.base;p.ci=result;p.ciHead=hd;p.ciBase=bs;p.ciTree=SHA('f'+id+(++s.seq).toString(16));log('模拟 CI 回执',`PR #${id} ${result}；受测 ${sh(p.ciTree)}，对应 ${sh(hd)} + ${sh(bs)}。`);render();prModal(+id);break;}
case 'update-base':{mutate(pr(+id),true);render();ciModal(+id);break;}
case 'accept':acceptModal(+id);break;
case 'accept-confirm':{const p=pr(+id);p.acceptance={sha:modalState.head,result:$('#accept-result').value};log('组合验收结果（模拟）',`PR #${id} ${p.acceptance.result} @${sh(p.acceptance.sha)}；不自动合并。`);render();prModal(+id);break;}
case 'explain':{pr(+id).explanation=true;log('技术解读示例已关联',`PR #${id} · 实际产品复用原生执行器生成内容。`);render();report(pr(+id).issue);break;}
case 'decision-record':s.decisions.D1.record=true;log('模拟读取到决定文字','D1 的格式可识别，但 owner 来源与实施条件尚待核对。');render();nativeModal('cc-B');break;
case 'decision-confirm':if(s.decisions.D1.record){s.decisions.D1.confirmed=true;log('模拟核对 owner 决定来源','D1 已确认，只解决产品取舍；还未证明本版本落实。');render();nativeModal('cc-B');}break;
case 'apply-decision':{const d=s.decisions.D1;if(!d.confirmed){toast('先确认有效的 owner 决定。');break;}d.applied=true;d.head=pr(+id).head;log('决定实施证据已关联（模拟）','D1 绑定 PR #'+id+' 当前 head；审核结论没有自动变成 PASS。');render();prModal(+id);break;}
case 'disconnect':{const a=ses(id);a.state='unknown';a.event='模拟连接断开：进程是否存活未知';log('执行状态未知',id+' 保留执行归属，不重派、不杀进程。');render();sessionModal(id);break;}
case 'probe':probeModal(id);break;
case 'probe-confirm':{const a=ses(id),result=$('#probe-result').value,it=intent('核查原执行器',id);it.state='sent';closeModal();later(()=>{a.state=result;a.event=({unknown:'仍未取得足够运行事实',running:'确认原轮次仍在执行',waiting:'确认原生会话等待批准',terminated:'确认原进程已退出，产物仍保留'})[result]+'（模拟）';finish(it,a.event,result==='unknown'?'unknown':'confirmed');toast(a.event);},900);break;}
case 'pause':doPause(id);break;
case 'resume':doResume(id);break;
case 'prompt':promptModal(+id);break;
case 'copy-prompt':copyText($('#prompt-text').textContent);break;
case 'export':downloadState();break;
case 'reset':openModal('重置这份离线演示？','<p>清除本页模拟派发、消息、合并、判断与执行状态，回到初始场景。不会影响任何真实服务或仓库。</p>',`${B('取消','close')}${B('确认重置','reset-confirm','','primary')}`);break;
case 'reset-confirm':timers.forEach(clearTimeout);timers.clear();const th=s.theme;s=initial();s.theme=th;closeModal();$('#search').value='';save();render();toast('演示已重置。');break;
}save();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled){try{act(el.dataset.action,el.dataset.id||'',el);}catch(err){console.error(err);toast('演示操作异常，可重置页面。没有请求任何外部服务。');}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#sidebar').classList.remove('open');}const el=e.target.closest('[role=button][data-action]');if(el&&['Enter',' '].includes(e.key)){e.preventDefault();act(el.dataset.action,el.dataset.id||'',el);}if(e.key==='Tab'&&!$('#overlay').hidden){const fs=$$('#modal button:not(:disabled),#modal input:not(:disabled),#modal select:not(:disabled),#modal textarea:not(:disabled),#modal summary').filter(x=>x.offsetParent!==null);if(fs.length){if(e.shiftKey&&(document.activeElement===fs[0]||document.activeElement===$('#modal'))){e.preventDefault();fs.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===fs.at(-1)){e.preventDefault();fs[0].focus();}}}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal();});
$('#search').addEventListener('input',e=>{s.query=e.target.value;if(s.page==='overview')s.page='work';render();});
window.__tongxuDemo={snapshot:()=>JSON.parse(JSON.stringify(s)),checks:id=>mergeEligibility(pr(id)),reset:()=>{timers.forEach(clearTimeout);timers.clear();s=initial();save();render();},dispatch:dispatchTask};
render();if(interrupted){log('恢复离线演示','页面中断时尚未确认的动作保留为未知；没有自动重派。');toast('发现中断的演示动作：已保留为未知，未自动重试。');}
</script></body></html>
